.ctv table.ct { margin-top: 8px; width: 100%; }
.ctv table.ct td { border-bottom: 0; padding: 2px 8px 2px 0; overflow-wrap: anywhere; }
.ctv table.ct input { width: 100%; }
.ctv ul.gardes { margin: 2px 0 0 18px; padding: 0; color: var(--pale); }
.ctv .dit { color: var(--vert); }
body.conf #conflits { display: block; }
body.conf main, body.conf #puces { display: none; }
#conflits .intro { padding: 8px 12px; border-bottom: 1px solid var(--bleu); position: sticky; top: 0; background: var(--fond); z-index: 1; }
#conflits .intro p { margin: 6px 0 0; color: var(--pale); max-width: 120ch; }
#conflits .chiffres, #conflits .grille { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
#conflits .grille { margin-top: 8px; }
#conflits .grille button.on { border-color: var(--accent); background: var(--survol); }
#conflits .grille .sep { width: 1px; height: 18px; background: var(--trait); margin: 0 4px; }
#conflits details.arch > summary { list-style: none; display: flex; gap: 10px; align-items: baseline; padding: 3px 12px; border-bottom: 1px solid var(--trait); cursor: pointer; }
#conflits details.arch > summary::-webkit-details-marker { display: none; }
#conflits details.arch > summary:hover { background: var(--survol); }
#conflits details.arch > summary::before { content: "▸"; color: var(--pale); width: 10px; }
#conflits details.arch[open] > summary::before { content: "▾"; }
#conflits .rang { color: var(--pale); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
#conflits .du { color: var(--pale); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 0; min-width: 0; }
#conflits .bilan { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
#conflits .bilan b, .cf b { font-weight: 600; margin-left: 8px; }
#conflits .corps { padding: 2px 12px 10px 56px; border-bottom: 1px solid var(--trait); background: var(--bande); }
#conflits h4 { margin: 8px 0 2px; font-size: 12px; font-weight: 600; }
#conflits ul { list-style: none; margin: 0; padding: 0; }
#conflits li.paire { padding: 2px 0; }
#conflits li.paire small { color: var(--pale); margin-left: 8px; }
#conflits ul.res { margin: 1px 0 6px 18px; color: var(--pale); }
#conflits ul.res li { overflow-wrap: anywhere; }
#conflits li.ress { padding: 3px 12px; border-bottom: 1px solid var(--trait); }
#conflits li.ress code { overflow-wrap: anywhere; }
#conflits li.ress div { color: var(--pale); padding-left: 14px; }
#conflits li.ress div b { color: var(--texte, inherit); font-weight: 600; }
#conflits .chiffres .pousse { flex: 1 1 0; }
#conflits p.compte { margin: 0; padding: 6px 12px; color: var(--pale); }
#conflits .verbe { color: var(--pale); font-weight: 400; margin: 0 6px; }
#conflits .grille .pousse { flex: 1 1 0; }
#conflits .grille button small { color: var(--pale); margin-left: 4px; }
#conflits details.code > summary code { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#conflits details.code > summary b { white-space: nowrap; }
#conflits details.code .corps p { margin: 4px 0; color: var(--pale); }
#conflits li.site { padding: 3px 0 3px 10px; border-left: 2px solid var(--trait); margin: 2px 0; }
#conflits li.site.gagne { border-left-color: var(--vert); }
#conflits li.site .fich { margin-left: 8px; overflow-wrap: anywhere; text-align: left; }
#conflits li.site small { color: var(--pale); margin-left: 8px; }
#conflits li.site div { padding-top: 1px; }
#conflits li.site code.val { color: var(--pale); overflow-wrap: anywhere; margin-left: 6px; }
/* fenêtre d'analyse à part : la même page, réduite aux conflits */
body.analyse header > *:not(h1):not(#cherche):not(.pousse), body.analyse #chiffres { display: none; }
.cf { margin-left: 6px; font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; border: 1px solid var(--trait); border-radius: 9px; padding: 0 7px 0 0; }
.cf b:first-child { margin-left: 7px; }
#bulle { display: none; position: fixed; z-index: 20; max-width: 520px; background: var(--vscode-editorHoverWidget-background, #252526); color: var(--texte);
  border: 1px solid var(--vscode-editorHoverWidget-border, #454545); border-radius: 3px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); pointer-events: none; }
#bulle.on { display: block; }
#bulle h4 { margin: 4px 0 1px; font-size: 12px; }
#bulle div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bulle small { color: var(--pale); }
@media (max-width: 700px) { #reglages .champ { grid-template-columns: 1fr auto; } #reglages .champ > label { grid-column: 1 / 3; } #reglages .champ small { grid-column: 1 / 3; } }
</style>
</head>
<body>
<header>
  <h1>Red Stack</h1>
  <label for="profil">Profil</label>
  <select id="profil" title="Profil : ce qui est actif, et ce qu'on prend de chaque zip"></select>
  <button id="nouveau" title="Copier ce profil sous un nouveau nom">Nouveau…</button>
  <button id="supprime" title="Supprimer ce profil (le jeu ne change pas)">Supprimer</button>
  <span class="sep"></span>
  <input id="cherche" type="search" placeholder="Filtrer les mods…" aria-label="Filtrer les mods par nom">
  <input id="fichier" type="search" placeholder="À quel mod est ce fichier ?" aria-label="Chercher le mod d'un fichier du jeu" title="Texte du chemin d'un fichier du jeu, puis Entrée">
  <span class="pousse"></span>
  <span class="groupe" role="group" aria-label="Dépôt">
    <button id="arriv" title="Archives arrivées dans le dépôt : noms à mettre à la convention, conversion en .zip, remontée dans la pile" aria-pressed="false">Arrivages</button>
    <button id="maj" title="Mises à jour : chaque zip du dépôt comparé aux fichiers de son mod sur Nexus ; télécharger la nouvelle version à la place de l'ancienne" aria-pressed="false">Mises à jour</button>
    <button id="histo" title="Ce que Red Stack a écrit, geste par geste : chaque « Appliquer » (par mod : posé, retiré, mis à jour) et chaque geste sur le dépôt. Lecture seule.">Historique</button>
    <button id="magasin" title="Le magasin (un arbre par mod, lié au jeu) : état des liens, poids réel sur le disque, arbres à purger, retouches à annuler">Magasin</button>
  </span>
  <span class="sep"></span>
  <span class="groupe" role="group" aria-label="Analyses, chacune dans son onglet">
    <button id="conf" title="Analyse des conflits dans les archives : ordre de chargement, qui gagne sur qui. S'ouvre dans un onglet à côté. Lecture seule.">Conflits</button>
    <button id="scripts" title="Conflits de code entre mods : méthodes Redscript, propriétés TweakXL. S'ouvre dans un onglet à lui. Lecture seule ; la première fois, quelques dizaines de secondes.">Scripts</button>
  </span>
  <span class="sep"></span>
  <button id="regle" title="Dossiers du dépôt, du jeu et du magasin, convention, réglages, hors Red Stack, référence du jeu" aria-pressed="false">Réglages</button>
  <button id="aide" class="discret" title="Manuel de Red Stack : chaque vue expliquée, dans un onglet à côté" aria-label="Manuel">?</button>
  <button id="actualise" class="discret" title="Relire le dépôt et le jeu maintenant" aria-label="Actualiser">↻</button>
  <button id="plan" class="plein" title="Ce qui serait posé, remplacé, retiré : rien n'est écrit avant votre confirmation">Aperçu du plan</button>
</header>
<div id="alerte" role="alert"><span></span><button id="fermeAlerte">Fermer</button></div>
<div id="verrou" role="status">Red Stack écrit : la page est verrouillée jusqu'à la fin du geste en cours.</div>
<div id="resume" aria-live="polite"><span id="chiffres">Lecture du dépôt et du jeu…</span><span id="occupe">Le moteur travaille…</span><span class="pousse"></span>
  <button id="plieTout" class="discret" title="Tout replier ; si tout est déjà replié, tout déplier (piles de la liste, des mises à jour et des arrivages, lignes des conflits)">⇕ Tout plier / déplier</button>
  <label title="Montrer le nom entier du zip au lieu du titre lu dans un nom de téléchargement Nexus"><input type="checkbox" id="complets"> Noms complets</label>
  <label title="Montrer, pour un zip parqué, nouveau ou retiré, le dossier où il se trouve"><input type="checkbox" id="dossiers"> Dossiers</label>
  <label title="Montrer la colonne « Nature » ; décochée, elle rend sa largeur aux noms des mods"><input type="checkbox" id="natures"> Natures</label></div>
<div id="puces" role="toolbar" aria-label="Filtrer par état"></div>
<main>
  <div id="liste"></div>
  <div id="poignee" role="separator" aria-orientation="vertical"></div>
  <aside id="volet" aria-label="Détail"></aside>
</main>
<section id="conflits" class="vue" aria-label="Conflits d'archives"></section>
<section id="arrivages" class="vue" aria-label="Arrivages"></section>
<section id="majs" class="vue" aria-label="Mises à jour"></section>
<section id="reglages" aria-label="Réglages"></section>
<div id="bulle" role="tooltip"></div>
<script nonce="{{nonce}}">window.RS_L = {{langue}};</script>
<script nonce="{{nonce}}">
(function () {
  'use strict';
  // langue : T et N rendent le texte français du code, ou celui du catalogue reçu (voir langue.js)
  const { T, N } = window.RS_L;
  if (window.RS_L.langue !== 'fr') {                 // textes écrits en HTML dans le corps : traduits une fois, à l'ouverture
    document.documentElement.lang = window.RS_L.langue;
    for (const el of document.body.querySelectorAll('*')) {
      if (el.tagName === 'SCRIPT') continue;
      for (const a of ['title', 'placeholder', 'aria-label']) { const v = (el.getAttribute(a) || '').trim(); if (v) el.setAttribute(a, window.RS_L.T(v)); }
      for (const n of el.childNodes) { const v = n.nodeType === 3 ? n.nodeValue.trim() : ''; if (v) n.nodeValue = n.nodeValue.replace(v, () => window.RS_L.T(v)); }
    }
  }
  const vscode = acquireVsCodeApi();
  const $ = (id) => document.getElementById(id);
  const SEULE = document.body.classList.contains('analyse');   // onglet d'analyse des conflits, à part de la page
  const CODE = document.body.classList.contains('code');       // onglet « Scripts et tweaks » : la même page, réduite aux conflits de code
  if (SEULE) { document.getElementById('cherche').placeholder = T('Filtrer : mod, archive ou ressource…'); document.getElementById('cherche').setAttribute('aria-label', T("Filtrer par mod, par nom d'archive ou par chemin de ressource")); }
  if (CODE) { document.getElementById('cherche').placeholder = T('Filtrer : mod, méthode, propriété ou fichier…'); document.getElementById('cherche').setAttribute('aria-label', T('Filtrer par mod, par méthode, par propriété ou par fichier')); }
  const E = { profil: '', profils: [], data: null, plies: new Set(), choisi: '', volet: null, sauve: vscode.getState() || {}, filtre: 'tous', tri: { col: '', sens: 1 }, nature: '', lot: new Set(), attente: new Map(), vol: new Map() };
  if (E.sauve.tri && E.sauve.tri.col) E.tri = E.sauve.tri;
  const memorise = () => vscode.setState({ plies: [...E.plies], tri: E.tri, complets: E.complets, dossiers: E.dossiers, natures: E.natures, voletL: E.voletL });
  E.complets = !!E.sauve.complets;
  E.voletL = +E.sauve.voletL || 0;                  // largeur du volet réglée à la poignée, en pixels ; 0 = 44 % de la page
  E.dossiersOuverts = new Set();                    // dossiers dépliés dans la fiche d'un mod, le temps de la séance
  E.dossiers = E.sauve.dossiers !== false;          // montrés d'office
  E.natures = E.sauve.natures !== false;            // colonne « Nature » montrée d'office
  E.choixOuverts = true;                            // plan : bloc des choix faits, déplié d'office, replié à la demande
  document.body.classList.toggle('sansnature', !E.natures);
  const ICO = {
    detail: '<circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.6M8 5.1v.2"/>',
    zip: '<path d="M2.5 4.5h11v8.5h-11zM2.5 4.5l1.3-2h8.4l1.3 2M6.5 7.5h3"/>',
    arbre: '<path d="M1.8 4.2h4.3l1.3 1.6h6.8v7H1.8z"/>',
    nexus: '<path d="M6.5 3.5h-3v9h9v-3M9 2.5h4.5V7M13.3 2.7L7.5 8.5"/>',
    parque: '<path d="M8 2.5v7M5 6.8l3 3 3-3M2.5 11v2.5h11V11"/>',
    remonte: '<path d="M8 10v-7M5 5.7l3-3 3 3M2.5 11v2.5h11V11"/>',
    retire: '<path d="M3 4.5h10M6.3 4.5V2.8h3.4v1.7M4.3 4.5l.6 8.7h6.2l.6-8.7M6.7 6.8v4.2M9.3 6.8v4.2"/>',
    supprime: '<path d="M3 4.5h10M6.3 4.5V2.8h3.4v1.7M4.3 4.5l.6 8.7h6.2l.6-8.7M6.4 7l3.2 3.6M9.6 7l-3.2 3.6"/>',
  };
  const FILTRES = [['tous', T('Tous')], ['actifs', T('Actifs')], ['coupes', T('Coupés')], ['jamais', T('Jamais posés')], ['attente', T('À appliquer')], ['neufs', T('Nouveaux')], ['modifies', T('Modifiés en jeu')], ['parques', T('Parqués')], ['retires', T('Retirés')]];
  // nature d'un mod : ce que son zip pose (fait lu dans le zip) ; « socle » = chargeur, ou mod que d'autres mods du dépôt appellent
  const NATURE = { socle: [T('socle'), T("Socle : un chargeur (CET, RED4ext, Redscript, ArchiveXL, TweakXL, Codeware), ou un mod que d'autres mods du dépôt appellent par leur code.")],
    archive: [T('archive'), T('Pose des archives dans archive/pc/mod.')], xl: ['xl', T('Pose des fichiers .xl lus par ArchiveXL.')],
    redmod: ['REDmod', T('Mod au format REDmod (dossier mods).')], reds: [T('scripts'), T('Pose des scripts Redscript dans r6/scripts.')],
    tweak: [T('tweaks'), T('Pose des tweaks lus par TweakXL dans r6/tweaks.')], cet: ['CET', T("Pose un mod Cyber Engine Tweaks (Lua), ou des fichiers dans le dossier d'un autre.")],
    red4ext: ['RED4ext', T('Pose un greffon RED4ext (.dll).')], asi: ['asi', T('Pose un greffon .asi dans bin/x64/plugins.')], audio: [T('audio'), T('Pose des sons pour Audioware.')],
    reshade: ['ReShade', T('Pose des shaders ReShade.')], config: [T('réglages'), T('Pose des fichiers de configuration du jeu (r6/config, r6/input, engine/config).')],
    autre: [T('autre'), T('Pose aussi des fichiers hors de ces dossiers (racine du jeu, bin/x64, documentation).')] };
  const COLS = [['nom', T('Mod'), 'mod'], ['version', T('Version'), 'version'], ['etat', T('État'), 'etat'], ['nature', T('Nature'), 'nature'], ['fichiers', T('Fichiers'), 'nb'], ['taille', T('Taille'), 'nb']];
  (E.sauve.plies || []).forEach((s) => E.plies.add(s));
  const h = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LANGUE = window.RS_L.langue;
  const taille = (n) => (n >= 1e9 ? T`${(n / 1e9).toLocaleString(LANGUE, { minimumFractionDigits: 1, maximumFractionDigits: 1, useGrouping: false })} Go` : n >= 1e6 ? T`${Math.round(n / 1e6)} Mo`
    : n >= 1e3 ? T`${Math.round(n / 1e3)} Ko` : T`${n} o`);
  // avancée d'un téléchargement : reçu sur attendu, débit, temps restant du lot
  const poids1 = (n) => (n >= 1e9 ? taille(n) : T`${(n / 1e6).toLocaleString(LANGUE, { minimumFractionDigits: 1, maximumFractionDigits: 1, useGrouping: false })} Mo`);
  const duree = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const ditAvance = (a) => (!a || !a.taille ? '' : T('{0} sur {1}', poids1(a.recu), poids1(a.taille)) + ` · ${poids1(a.debit)}/s`
    + (a.debit > 0 && a.lotTotal > a.lotRecu ? ` · ≈ ${duree((a.lotTotal - a.lotRecu) / a.debit)}` : ''));
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;
  const ico = (act, titre, extra) => `<button class="ico" data-act="${act}" title="${h(titre)}" aria-label="${h(titre)}"${extra || ''}><svg viewBox="0 0 16 16">${ICO[act]}</svg></button>`;
  const CLE_TRI = {
    nom: (r) => lit(r.nom).titre.toLowerCase(), version: (r) => r.version || '', etat: (r) => r.etat, nature: (r) => (r.natures || []).join(' '),
    fichiers: (r) => r.fichiers_poses, taille: (r) => r.taille,
  };
  function trie(lignes) {
    const f = CLE_TRI[E.tri.col];
    if (!f) return lignes;                           // pas de tri choisi : l'ordre du dépôt, celui du chargement
    return lignes.slice().sort((a, b) => {
      const x = f(a), y = f(b);
      return E.tri.sens * (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), LANGUE, { numeric: true }));
    });
  }

  /** Nom lisible d'un zip Nexus : « Auteur - Mod-12345-1-2-1790000000 EDITED » -> titre, numéro Nexus, variante. */
  function lit(nom) {
    const base = nom.replace(/\.zip$/i, '');
    const m = /^(.*?)-(\d{3,6})-([\w.\-]+?)-(\d{9,10})(.*)$/.exec(base);
    return m ? { titre: m[1].trim(), nexus: m[2], variante: m[5].trim() } : { titre: base, nexus: '', variante: '' };
  }
  const aEcrire = (r) => r.pose + r.remplace + r.retire;
  function classe(r) {
    if (r.lieu) return '';
    if (aEcrire(r) || r.etat.startsWith('à ')) return 'attente';
    if (r.etat === 'nouveau dans le dépôt') return 'neuf';
    if (r.etat.startsWith('posé')) return 'ok';
    return '';
  }
  function garde(r, filtre) {
    const t = $('cherche').value.trim().toLowerCase(), f = filtre || E.filtre;
    if (t && !r.cle.toLowerCase().includes(t)) return false;
    if (E.nature && !(r.natures || []).includes(E.nature)) return false;
    // « Nouveaux » : dossiers d'arrivée ET zips de la pile que le profil ne connaît pas ; parqués et retirés : leur dossier
    if (f === 'neufs') return r.lieu ? r.genre === 'nouveau' : r.etat === 'nouveau dans le dépôt';
    if (f === 'parques') return r.genre === 'parqué' && !!r.lieu;
    if (f === 'retires') return r.genre === 'retiré' && !!r.lieu;
    if (r.lieu) return false;
    if (f === 'actifs') return r.actif;
    if (f === 'coupes') return !r.actif && r.etat.startsWith('coupé');
    if (f === 'jamais') return r.etat === 'jamais posé';
    if (f === 'attente') return aEcrire(r) > 0 || r.etat.startsWith('à ');
    if (f === 'modifies') return r.etat.includes('modifié');
    return true;
  }

  function dessine() {
    const d = E.data;
    if (!d) return;
    const actifs = d.mods.filter((r) => !r.lieu);
    const on = actifs.filter((r) => r.actif);
    const attente = actifs.filter((r) => aEcrire(r) > 0);
    const neufs = actifs.filter((r) => r.etat === 'nouveau dans le dépôt').length;
    $('chiffres').innerHTML = T`<b>${on.length}</b> mods actifs sur ${actifs.length} · <b>${taille(on.reduce((a, r) => a + r.taille, 0))}</b> de zips`
      + (neufs ? ` · ${N(neufs, '<b>{n}</b> nouveau dans le dépôt', '<b>{n}</b> nouveaux dans le dépôt')}` : '')
      + (d.gardes ? ` · ${N(d.gardes, '{n} fichier modifié en jeu', '{n} fichiers modifiés en jeu')}` : '')
      + (d.conflits.length ? ` · ${T`<b>${N(d.conflits.length, '{n} conflit', '{n} conflits')}</b> à trancher`}` : '')
      + ` · ${T('jeu')} <span class="chemin">${h(d.jeu)}</span>` + (d.reel ? '' : ` ${T('(banc)')}`);
    const n = attente.length;
    $('plan').textContent = n ? T`Aperçu du plan (${N(n, '{n} mod', '{n} mods')})` : T('Aperçu du plan');
    $('supprime').disabled = E.profil === 'actuel';
    const sel = $('profil');
    sel.innerHTML = E.profils.map((p) => `<option value="${h(p.nom)}"${p.nom === E.profil ? ' selected' : ''}>${h(p.nom)} (${p.actifs})</option>`).join('');

    // zips rangés cochés (dossiers d'arrivée, parqués, retirés) : un lot à remonter, parquer ou retirer d'un geste
    const ranges = new Map(d.mods.filter((r) => r.lieu).map((r) => [r.cle, r]));
    for (const k of [...E.lot]) if (!ranges.has(k)) E.lot.delete(k);
    const lot = [...E.lot].map((k) => ranges.get(k)), LOT = ['neufs', 'parques', 'retires'].includes(E.filtre);
    $('puces').innerHTML = FILTRES.map(([k, mot]) => `<button data-filtre="${k}" class="${k === E.filtre ? 'on' : ''}" aria-pressed="${k === E.filtre}">${mot}<b>${d.mods.filter((r) => garde(r, k)).length}</b></button>`).join('')
      + (!lot.length ? '' : `<span class="lot"><b>${N(lot.length, '{n} zip coché', '{n} zips cochés')}</b>`
        + `<button data-lotvers="pile">${T`Remonter dans la pile…`}</button>`
        + `<button data-lotvers="parques"${lot.some((r) => r.genre !== 'parqué') ? '' : ' disabled'}>${T`Parquer…`}</button>`
        + `<button data-lotvers="retires"${lot.some((r) => r.genre !== 'retiré') ? '' : ' disabled'}>${T`Retirer…`}</button>`
        + (lot.some((r) => r.genre === 'retiré') ? `<button data-lotsuppr="1" title="${T`Supprimer les zips retirés cochés : ils quittent le dépôt pour la corbeille de Windows (après confirmation)`}">${T`Supprimer…`}</button>` : '')
        + `<button data-lotvide="1">${T`Tout décocher`}</button></span>`);
    const fleche = (c) => (E.tri.col === c ? (E.tri.sens > 0 ? ' ▲' : ' ▼') : '');
    const html = ['<table class="entete"><thead><tr><th class="case"></th>'
      + COLS.map(([c, mot, cl]) => `<th class="${cl}${E.tri.col === c ? ' tri' : ''}" data-tri="${c}" title="${T`Trier par ${mot.toLowerCase()} ; le troisième clic rend l&#39;ordre du dépôt`}">${mot}${fleche(c)}</th>`).join('')
      + `<th class="actions">${T`Actions`}</th></tr></thead></table>`];
    let lignes = 0;
    for (const s of d.sections) {
      const tous = d.mods.filter((r) => r.section === s);
      const vus = trie(tous.filter((r) => garde(r)));
      if (!vus.length) continue;
      lignes += vus.length;
      const dossier = (tous.find((r) => !r.lieu) || tous[0]).zip.replace(/[\\/][^\\/]+$/, '');
      const pile = tous.filter((r) => !r.lieu), actifsPile = pile.filter((r) => r.actif).length;
      const etatCase = actifsPile === 0 ? '' : actifsPile === pile.length ? 'checked' : 'data-mi="1"';
      // filtres des zips rangés : la case de la pile coche ces zips pour un lot, elle ne touche jamais le profil
      const rangesVus = vus.filter((r) => r.lieu), coches = rangesVus.filter((r) => E.lot.has(r.cle)).length;
      html.push(`<details class="pile" data-pile="${h(s)}"${E.plies.has(s) ? '' : ' open'}><summary>`
        + (!LOT ? `<input type="checkbox" data-pile-case="${h(s)}" ${etatCase} title="${T`Activer ou couper toute la pile`}" aria-label="${T`Pile ${h(nomPile(s))}`}">`
          : rangesVus.length ? `<input type="checkbox" data-pile-case="${h(s)}" data-pile-lot="1" ${coches === 0 ? '' : coches === rangesVus.length ? 'checked' : 'data-mi="1"'} title="${T`Cocher ou décocher les zips rangés de cette pile montrés ici`}" aria-label="${T`Pile ${h(nomPile(s))}`}">` : '')
        + `<span class="nom">${h(nomPile(s))}</span>${ico('arbre', T('Ouvrir le dossier de la pile dans le dépôt'), ` data-chemin="${h(dossier)}"`)}<span class="compte">${actifsPile} / ${pile.length} · ${taille(pile.filter((r) => r.actif).reduce((a, r) => a + r.taille, 0))}</span>`
        + '</summary><table><tbody>');
      const motEtat = (r) => r.lieu ? dit(r.genre) + (E.dossiers ? ` (${r.lieu})` : '') : dit(r.etat);
      for (const r of vus) {
        const fo = r.fomod && r.fomod.actif, l = lit(r.nom), pack = !fo && Object.keys(r.options).some((o) => o !== '');
        html.push(`<tr data-cle="${h(r.cle)}" class="${r.lieu ? 'hors' : r.actif ? '' : 'coupe'}${r.cle === E.choisi ? ' choisi' : ''}">`
          + `<td class="case">${r.lieu ? `<input type="checkbox" data-lot="${h(r.cle)}"${E.lot.has(r.cle) ? ' checked' : ''} title="${T`Cocher ce zip rangé pour le remonter, le parquer ou le retirer avec d'autres`}" aria-label="${h(l.titre)}">` : `<input type="checkbox" data-case="${h(r.cle)}"${r.actif ? ' checked' : ''} aria-label="${h(l.titre)}">`}</td>`
          + `<td class="mod" title="${h(r.nom)}">${E.complets ? h(r.nom.replace(/\.zip$/i, '')) : h(l.titre) + (l.variante ? `<small>${h(l.variante)}</small>` : '')}${pack ? '<span class="puce pack">pack</span>' : ''}${fo ? `<span class="puce pack" title="${r.fomod.regle ? T`Posé par son installateur FOMOD. Ses choix : détail du mod, « Installateur… ».` : T`Posé par son installateur FOMOD : choix par défaut, jamais réglés. Ses choix : détail du mod, « Installateur… ».`}">FOMOD</span>` : ''}${pastilleConflits(r.cle)}</td>`
          + `<td class="version">${h(r.version)}</td>`
          + `<td class="etat"><span class="puce ${classe(r)}" title="${h(motEtat(r))}">${h(motEtat(r))}</span></td>`
          + `<td class="nature">${(r.natures || []).map((x) => `<button class="nat ${x}${E.nature === x ? ' on' : ''}" data-nature="${x}" title="${T`${h(NATURE[x][1])} Clic : ne montrer que ces mods ; second clic : tous.`}">${NATURE[x][0]}</button>`).join('')}</td>`
          + `<td class="nb" title="${r.hors ? T`Fichiers posés dans le jeu / fichiers que le zip peut poser ; ${r.hors} hors Red Stack (installateur tiers), non comptés` : T`Fichiers posés dans le jeu / fichiers que le zip peut poser`}">${r.fichiers_poses} / ${r.posables}</td>`
          + `<td class="nb">${taille(r.taille)}</td>`
          + `<td class="actions">${ico('detail', T('Détail : fichiers, options, priorités'))}${ico('zip', T('Montrer le zip dans le dépôt'))}`
          + `${ico('arbre', r.arbre ? T('Ouvrir son arbre dans le magasin') : T('Aucun arbre : mod parqué ou magasin absent'), r.arbre ? '' : ' disabled')}`
          + `${ico('nexus', l.nexus ? T('Page Nexus du mod') : T('Aucun numéro Nexus dans le nom du zip'), l.nexus ? ` data-id="${h(l.nexus)}"` : ' disabled')}`
          + `${r.lieu ? ico('remonte', T('Remonter ce zip à la racine de sa pile (écrit le dépôt, après confirmation)'))
              + (r.genre === 'nouveau' ? ico('parque', T('Parquer ce zip : il passe dans le dossier des parqués de sa pile (écrit le dépôt, après confirmation)')) : '')
              + (r.genre === 'retiré' ? ico('supprime', T('Supprimer ce zip retiré : il quitte le dépôt pour la corbeille de Windows (après confirmation)')) : ico('retire', T('Retirer ce zip : il passe dans le dossier des retirés de sa pile, rien n\'est effacé (écrit le dépôt, après confirmation)')))
            : ico('parque', r.fichiers_poses ? T('Parquer : d\'abord le couper et appliquer le plan (ses fichiers sont encore dans le jeu)')
              : T('Parquer ce mod : le zip passe dans le dossier des parqués de sa pile (écrit le dépôt, après confirmation)'), r.fichiers_poses ? ' disabled' : '')}</td></tr>`);
      }
      html.push('</tbody></table></details>');
    }
    const haut = $('liste').scrollTop;
    $('liste').innerHTML = html.join('') + (lignes ? '' : d.mods.length ? `<p class="vide">${T`Aucun mod ne correspond à ce filtre.`}</p>`
      : `<div class="vide"><p>${T`Aucun zip trouvé dans le dépôt.`} ${T`Red Stack lit les zips posés à la racine du dépôt, dans ses piles et dans leurs dossiers de convention.`}</p>${ecartsHtml(E.ecarts)}</div>`);
    $('liste').querySelectorAll('[data-mi]').forEach((c) => { c.indeterminate = true; });
    $('liste').scrollTop = haut;
  }

  // ---------------------------------------------------------------- volet : détail, plan, fichiers
  function ferme() { E.volet = null; E.choisi = ''; $('volet').className = ''; $('volet').innerHTML = ''; dessine(); }
  function ouvre(titre, corps) {
    $('volet').className = 'on';
    $('volet').innerHTML = `<div class="tete"><h2>${titre}</h2>${corps.includes('<details') ? `<button data-plie="1" class="discret" title="${T`Tout replier ; si tout est déjà replié, tout déplier`}">⇕</button>` : ''}<button data-ferme="1" title="${T`Fermer le volet`}">${T`Fermer`}</button></div><div class="corps">${corps}</div>`;
    $('volet').scrollTop = 0;
  }

  // État d'un fichier : pastille de couleur + mot. Vert = dans le jeu comme le veut le profil, rouge = non pris,
  // ambre = le jeu et le profil diffèrent (à poser, à retirer) ou le fichier demande un regard (écrasé, modifié).
  const memeMod = (a, b) => { const x = lit(a.split('/').pop()), y = lit(b.split('/').pop()); return x.titre === y.titre && (x.variante || '') === (y.variante || ''); };
  function etatFichier(e, moi, jumelle) {
    const present = e.etat === 'lié' || e.etat === 'copié' || e.etat.startsWith('partagé avec ');
    const autre = /^(partagé avec|écrasé par) (.+)$/.exec(e.etat);
    let mot = autre ? `${dit(autre[1])} ${lit(autre[2].split('/').pop()).titre}` : dit(e.etat), ton = 'ambre';
    if (e.hors) { mot = T('hors Red Stack'); ton = 'gris'; }
    else if (e.mien && present) { mot = T('à ce mod (pris à l\'installateur)'); ton = 'vert'; }
    else if (e.mien && e.etat !== 'absent') { mot = T`à ce mod, ${dit(e.etat)}`; ton = 'ambre'; }
    else if (e.option === null) ton = 'gris';
    else if (e.pris && autre && moi && memeMod(autre[2], moi)) {      // tenu par la version d'avant de ce même mod : une mise à jour à appliquer
      if (autre[1] === 'écrasé par') mot = T('à remplacer'); else { mot = T('inchangé depuis la version d\'avant'); ton = 'vert'; }
    }
    else if (e.pris && present) ton = 'vert';
    else if (e.pris && e.etat === 'absent') mot = T('à poser');
    else if (!e.pris && autre && autre[1] === 'partagé avec') { mot = T`déjà chargé par ${lit(autre[2].split('/').pop()).titre}`; ton = 'gris'; }
    else if (!e.pris && present && jumelle) { mot = T('tenu par un autre dossier de ce zip'); ton = 'gris'; }   // même cible, entrée jumelle cochée : rien ne sort du jeu
    else if (!e.pris && present) mot = T('à retirer');
    else if (!e.pris) { mot = T('non pris'); ton = 'rouge'; }
    return `<span class="pastille ${ton}"></span><b class="mot ${ton}">${h(mot)}</b>`;
  }

  function voletDetail(d) {
    const haut = E.volet && E.volet.t === 'detail' && E.volet.d.cle === d.cle ? $('volet').scrollTop : 0;   // même mod redessiné : on reste où on était
    E.volet = { t: 'detail', d };
    const l = lit(d.nom), opts = Object.keys(d.options), fo = d.fomod, parFo = !!(fo && fo.actif);
    const pack = !parFo && opts.some((o) => o !== '');
    const pris = d.entrees.filter((e) => e.pris).length, hors = d.entrees.filter((e) => e.hors).length;
    let c = `<div class="faits"><span>${h(nomPile(d.section))}</span>${d.version ? `<span>version ${h(d.version)}</span>` : ''}`
      + (d.redmod || []).map((x) => `<span title="${T`Déclaré par mods/${h(x.dossier)}/info.json`}">${T`REDmod « ${h(x.nom || x.dossier)} »${x.version ? ' ' + h(x.version) : ''}`}</span>`).join('')
      + `<span>${d.actif ? T('actif') : T('coupé')}</span><span>${N(pris, '{n} fichier pris sur {0}', '{n} fichiers pris sur {0}', d.entrees.filter((e) => e.option !== null && !e.hors).length)}</span>`
      + (hors ? `<span title="${T`Fichiers d'un installateur tiers déjà dans le jeu : jamais liés, remplacés ni retirés`}">${T`${hors} hors Red Stack`}</span>` : '') + '</div>'
      + `<div class="actions"><button data-montre="${h(d.zip)}">${T`Montrer le zip`}</button>`
      + (fo && !fo.erreur ? `<button data-fomodmod="${h(d.cle)}"${parFo ? ' class="plein"' : ''} title="${T`Les pages de choix de l'installateur FOMOD de ce zip`}">${T`Installateur…`}</button>` : '')
      + `<button data-ctmod="${h(d.cle)}" title="${T`Renommer ce que ce zip livre (archives, dossiers de scripts et de tweaks), après lecture des références du dépôt`}">${T`Renommer le contenu…`}</button>`
      + `<button data-nomsmod="${h(d.cle)}" title="${T`Poser ce mod sous d'autres noms DANS LE JEU (archives, .xl, scripts, tweaks, dossier CET ou REDmod) : le profil le note, le zip ne change pas. Dit qui cite chaque nom.`}">${T`Noms dans le jeu…`}</button>`
      + (d.arbre ? `<button data-montre="${h(d.arbre)}" title="${h(d.arbre)}">${T`Ouvrir son arbre`}</button>` : '')
      + (l.nexus ? `<button data-nexus="${h(l.nexus)}">${T`Page Nexus`}</button>` : '') + '</div>';
    if (fo) c += `<h3>${T`Installateur FOMOD`}</h3><p class="aide">` + (fo.erreur ? T`Illisible (${h(fo.erreur)}) : ce zip reste un pack à piocher.`
      : parFo ? T`Ce mod est posé par son installateur « ${h(fo.module)} » : ${N(fo.fichiers, '{n} fichier', '{n} fichiers')}, ${fo.choix ? N(fo.choix, '{n} groupe de choix', '{n} groupes de choix') : T('aucun choix à faire')}${fo.regle ? '' : ` ${T('(choix par défaut, jamais réglés)')}`}. Les cases des fichiers suivent ses choix.`
        : T('Ce zip porte un installateur, qui n\'est pas suivi : la sélection ci-dessous est faite à la main.')) + '</p>';
    if (pack) {
      c += `<h3>${T`Options du pack`}</h3>`;
      for (const o of opts) {
        const on = d.sel ? o in d.sel : o === '';
        const partiel = on && d.sel && Array.isArray(d.sel[o]);
        c += `<label class="option"${partiel ? ' title="Une partie seulement des fichiers de cette option est prise"' : ''}><input type="checkbox" data-option="${h(o)}"${on ? ' checked' : ''}${partiel ? ' data-partiel="1"' : ''}>`
          + `<span>${o === '' ? T('Fichiers directs') : o === '(racine)' ? T('Archives en vrac, à la racine du zip') : h(o)}</span><span class="n">${N(d.options[o], '{n} fichier', '{n} fichiers')}</span></label>`;
      }
    }
    if (d.priorites.length) {
      c += `<h3>${T`Priorités`}</h3><ul>` + d.priorites.map(([g, p]) =>
        `<li>${g === d.cle ? `${T('gagne sur')} ` + h(lit(p.split('/').pop()).titre) : `${T('perd contre')} ` + h(lit(g.split('/').pop()).titre)}</li>`).join('') + '</ul>';
    }
    // un autre mod actif tient des fichiers de celui-ci : un bouton par mod pour dire qui gagne
    const tenus = [...new Set(d.entrees.filter((e) => e.pris && e.etat.startsWith('écrasé par ')).map((e) => e.etat.slice(11)))];
    const dessus = tenus.filter((z) => !memeMod(z, d.nom) && !d.priorites.some(([g, p]) => g === d.cle && p === z));
    if (tenus.some((z) => memeMod(z, d.nom))) c += `<p class="aide">${T`La version d'avant de ce mod est encore dans le jeu : « Aperçu du plan » puis « Appliquer au jeu… » la remplace par celle-ci.`}</p>`;
    if (dessus.length) {
      c += `<h3>${T`Écrasé par un autre mod`}</h3>` + dessus.map((z) => `<div class="conflit"><div>${T`${h(lit(z.split('/').pop()).titre)} tient dans le jeu des fichiers que ce mod livre aussi.`}</div>`
        + `<div class="choix"><button data-gagne="${h(d.cle)}" data-contre="${h(JSON.stringify([z]))}" data-retour="detail">${T`Ce mod gagne sur ${h(lit(z.split('/').pop()).titre)}`}</button></div></div>`).join('');
    }
    c += `<h3>${T`Fichiers`}</h3><p class="faits">${T`Case cochée = fichier pris dans le profil. Le jeu ne change qu\'à « Aperçu du plan » puis « Appliquer ».`}</p>`;
    // triés par chemin (le zip les donne dans son ordre d'écriture) ; un pack, ou un gros mod, se lit par dossiers repliables
    const cibles = new Set(d.entrees.filter((e) => e.pris && e.dest).map((e) => e.dest.toLowerCase()));
    const ordre = (x, y) => x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' });
    const ligne = (e, court) =>
      `<li class="${e.pris ? '' : 'non'}"><span class="etatf">${etatFichier(e, d.nom, !e.pris && !!e.dest && cibles.has(e.dest.toLowerCase()))}${e.reglage ? ` · ${T('réglage')}` : ''} · ${taille(e.taille)}</span>`
      + (e.hors ? `<input type="checkbox" class="casef" data-entree="${h(e.entree)}" data-mien="1" title="${T`Hors Red Stack : fichier d'un installateur tiers, jamais lié, remplacé ni retiré. Cocher = ce fichier est à ce mod : il est pris au registre au prochain « Appliquer » et part avec le mod.`}">`
        : e.mien ? `<input type="checkbox" class="casef" data-entree="${h(e.entree)}" data-mien="1" checked title="${T`Ce fichier est à ce mod, par votre choix. Décocher = le rendre à l'installateur tiers : il reste dans le jeu et sort du registre.`}">`
        : e.option === null ? `<input type="checkbox" class="casef" disabled title="${T`Jamais posé : ce fichier ne va pas dans le jeu`}">`
        : parFo ? `<input type="checkbox" class="casef" disabled${e.pris ? ' checked' : ''} title="${T`Choisi par l'installateur : « Installateur… » pour changer ses choix`}">`
        : `<input type="checkbox" class="casef" data-entree="${h(e.entree)}"${e.pris ? ' checked' : ''} title="${T`Prendre ou laisser ce fichier`}">`)
      + `<code>${h(court)}</code>${e.dest && e.dest !== e.entree ? `<span class="vers">→ ${h(e.dest)}</span>` : ''}</li>`;
    const parDossier = pack || d.entrees.length > 40;
    const dossierDe = (e) => (pack ? e.option : e.entree.includes('/') ? e.entree.split('/')[0] : '');
    const groupes = new Map();
    for (const e of [...d.entrees].sort((x, y) => ordre(x.entree, y.entree))) { const g = parDossier ? dossierDe(e) : ''; if (!groupes.has(g)) groupes.set(g, []); groupes.get(g).push(e); }
    const cles = [...groupes.keys()].sort((x, y) => (x === null) - (y === null) || (y === '') - (x === '') || ordre(String(x), String(y)));
    if (cles.length < 2) c += '<ul>' + cles.map((g) => groupes.get(g).map((e) => ligne(e, e.entree)).join('')).join('') + '</ul>';
    else for (const g of cles) {
      const lg = groupes.get(g), p = lg.filter((e) => e.pris), id = g === null ? '|' : g;       // « | » : aucun dossier de zip ne porte ce nom
      const nom = g === null ? T('jamais posé') : g === '' ? T('Fichiers directs') : g === '(racine)' ? T('Archives en vrac, à la racine du zip') : g;
      c += `<details class="dossier" data-dossier="${h(id)}"${E.dossiersOuverts.has(d.cle + '|' + id) ? ' open' : ''}><summary><span class="n">${N(p.length, '{n} fichier pris sur {0}', '{n} fichiers pris sur {0}', lg.length)} · ${taille(p.reduce((n, e) => n + e.taille, 0))}</span><b>${h(nom)}</b></summary><ul>`
        + lg.map((e) => ligne(e, g && e.entree.toLowerCase().startsWith(g.toLowerCase() + '/') ? e.entree.slice(g.length + 1) : e.entree)).join('') + '</ul></details>';
    }
    ouvre(h(l.titre) + (l.variante ? ` <small>${h(l.variante)}</small>` : ''), c);
    $('volet').dataset.cle = d.cle;
    $('volet').querySelectorAll('input[data-partiel]').forEach((x) => { x.indeterminate = true; });
    $('volet').scrollTop = haut;
  }

  function voletFichier(nom, d) {
    E.volet = { t: 'fichier' };
    ouvre(T`Fichiers « ${h(nom)} »`, `<p class="faits">${d.total > d.fichiers.length ? N(d.total, '{n} fichier du jeu au registre, {0} montrés.', '{n} fichiers du jeu au registre, {0} montrés.', d.fichiers.length) : N(d.total, '{n} fichier du jeu au registre.', '{n} fichiers du jeu au registre.')}</p><ul>`
      + d.fichiers.map((f) => `<li><span class="etatf">${f.reglage ? T('réglage, copié') : f.lie ? T('lié') : T('copié')}</span><code>${h(f.dest)}</code>`
        + `<span class="vers">← <button class="lien" data-va="${h(f.zip)}">${h(lit(f.zip.split('/').pop()).titre)}</button> (${h(f.zip.split('/')[0])})</span></li>`).join('')
      + '</ul>' + (d.total ? '' : `<p class="vide">${T`Aucun fichier posé par un mod ne porte ce texte : socle du jeu, fichier créé en jeu, ou mod hors dépôt.`}</p>`));
  }

  /** Magasin : état des liens, poids réel sur le disque, arbres sans mod actif (purge), retouches (annulables). */
  function voletMagasin(d) {
    E.volet = { t: 'magasin' };
    const j = d.jeu, parMod = {};
    for (const r of d.retouches) (parMod[r.zip] = parMod[r.zip] || []).push(r);
    const poids = (n) => (n < 1e6 && n > 0 ? T('< 1 Mo') : taille(n));
    let c = `<p class="faits"><span>${N(d.arbres, '{n} arbre', '{n} arbres')}</span><span>${N(d.fichiers, '{n} fichier', '{n} fichiers')}</span><span>${poids(d.octets)}</span>`
      + (d.libre != null ? `<span>${T`${poids(d.libre)} libres sur le disque du jeu`}</span>` : '') + '</p>'
      + `<p><code>${h(d.magasin)}</code> <button class="mini" data-montre="${h(d.magasin)}">${T`Montrer`}</button></p>`;
    if (!d.existe) c += `<p class="vide">${T`Le magasin n\'existe pas encore : il est créé au premier « Appliquer ».`}</p>`;
    if (d.meme_disque === false) c += `<p class="avis"><span class="pastille rouge"></span>${T`Le magasin et le jeu sont sur deux disques : aucun lien possible, chaque fichier est copié et pèse deux fois. Le dossier du magasin se règle dans « Réglages ».`}</p>`;
    c += `<h3>${T`Poids réel`}</h3>`
      + `<p>${T`L'Explorateur de Windows additionne <b>${poids(d.explorateur)}</b> : le magasin, plus les fichiers des mods dans le jeu. Le disque n'en porte que <b>${poids(d.reel)}</b>.`} `
      + `${T`Un fichier lié existe une seule fois sur le disque, sous deux noms : celui de l\'arbre du mod et celui du jeu.`}</p>`
      + `<h3>${T`Dans le jeu`}</h3><ul>`
      + `<li><span class="pastille vert"></span>${N(j.lies, '{n} fichier lié au magasin', '{n} fichiers liés au magasin')} <small>· ${T`${poids(j.octets_lies)} · aucune place en plus`}</small></li>`
      + `<li><span class="pastille gris"></span>${N(j.copies, '{n} fichier copié', '{n} fichiers copiés')} <small>· ${T`${poids(j.octets_copies)} · dont ${N(j.reglages, '{n} réglage', '{n} réglages')}, jamais liés pour rester tels que le jeu les écrit`}</small></li>`
      + (j.a_lier ? `<li><span class="pastille ambre"></span>${N(j.a_lier, '{n} copie à changer en liens au prochain « Appliquer »', '{n} copies à changer en liens au prochain « Appliquer »')} <small>· ${T`${poids(j.octets_a_lier)} à rendre`}</small></li>` : '')
      + '</ul>'
      + `<h3>${T`Arbres sans mod actif`}</h3>`
      + (d.sans_mod.length
        ? `<p>${N(d.sans_mod.length, '{n} arbre que plus aucun mod actif de ce profil ne tient (mod coupé, parqué, ancienne version) : {0}. Un arbre se refait depuis son zip.', '{n} arbres que plus aucun mod actif de ce profil ne tient (mod coupé, parqué, ancienne version) : {0}. Un arbre se refait depuis son zip.', poids(d.octets_sans_mod))}</p><ul>`
          + d.sans_mod.slice(0, 200).map((x) => `<li><span class="etatf">${N(x.fichiers, '{n} fichier', '{n} fichiers')} · ${poids(x.octets)}</span><button class="lien" data-montre="${h(x.chemin)}" title="${T`Montrer cet arbre dans l'Explorateur`}">${h(x.arbre.split('/').pop())}</button> <small>${h(x.arbre.split('/')[0])}</small></li>`).join('')
          + `</ul><div class="actions"><button data-purge="1">${T`Purger ${N(d.sans_mod.length, '{n} arbre', '{n} arbres')} (${poids(d.octets_sans_mod)})…`}</button></div>`
        : `<p class="vide">${T`Aucun : chaque arbre du magasin est celui d\'un mod actif.`}</p>`)
      + `<h3>${T`Retouches`}</h3>`
      + (d.retouches.length
        ? `<p>${T`Fichiers d\'un arbre qui ne sont plus ceux du zip : édités à la main pour un essai, ou réécrits par le jeu à travers un lien. Ils sont posés tels quels.`}</p>`
          + Object.entries(parMod).map(([zip, l]) => `<div class="conflit fait"><b><button class="lien" data-va="${h(zip)}">${h(titreZip(zip))}</button></b> <small>${h(zip.split('/')[0])}</small><ul>`
            + l.map((r) => `<li><code>${h(r.entree)}</code></li>`).join('') + `</ul><div class="choix rang"><button class="mini" data-retouche="${h(zip)}">${T`Annuler ${N(l.length, '{n} retouche', '{n} retouches')}…`}</button></div></div>`).join('')
        : `<p class="vide">${T`Aucune : chaque arbre porte les fichiers de son zip.`}</p>`)
      + `<p><small>${T`Lecture seule tant que rien n\'est confirmé. Une session Claude lit cet état par l\'outil <code>red_stack_magasin</code>.`}</small></p>`;
    ouvre(T('Magasin'), c);
  }

  /** États rendus par le moteur : des CODES (son français, jamais traduit dans le JSON : la page les compare). Ici leur
   *  texte dans la langue de la page ; un code inconnu de cette table s'affiche tel quel. */
  const CODES = { 'posé': T('posé'), 'posé (modifié en jeu)': T('posé (modifié en jeu)'), 'à poser': T('à poser'), 'à compléter': T('à compléter'),
    'coupé': T('coupé'), 'coupé, à retirer': T('coupé, à retirer'), 'jamais posé': T('jamais posé'), 'nouveau dans le dépôt': T('nouveau dans le dépôt'),
    'parqué': T('parqué'), 'nouveau': T('nouveau'), 'retiré': T('retiré'), 'mis à jour': T('mis à jour'), 'modifié': T('modifié'),
    'lié': T('lié'), 'copié': T('copié'), 'absent': T('absent'), 'modifié en jeu': T('modifié en jeu'), 'autre contenu': T('autre contenu'),
    'hors Red Stack': T('hors Red Stack'), 'partagé avec': T('partagé avec'), 'écrasé par': T('écrasé par'),
    'renommé': T('renommé'), 'mise à jour': T('mise à jour'), 'remplacé': T('remplacé'), 'zip disparu': T('zip disparu'),
    'nouveau, coché d\'office': T('nouveau, coché d\'office'), 'non posable': T('non posable') };
  const dit = (c) => CODES[c] || c;
  // la pile des zips posés à la racine même du dépôt : son nom est un code du moteur, dit ici dans la langue
  const nomPile = (s) => (s === '(racine)' ? T('(racine du dépôt)') : s);
  /** Ce que la convention ne lit pas dans le dépôt : dossiers hors motif des piles, sous-dossiers hors convention. */
  function ecartsHtml(e) {
    if (!e || (!e.hors_piles.length && !e.profonds.length)) return '';
    const cite = (rows) => rows.slice(0, 8).map((r) => `<code>${h(r.dossier)}</code> (${r.archives})`).join(', ') + (rows.length > 8 ? ', …' : '');
    return (e.hors_piles.length ? `<p>${N(e.hors_piles.length, '{n} dossier du dépôt porte des archives mais son nom ne suit pas le motif des piles :', '{n} dossiers du dépôt portent des archives mais leur nom ne suit pas le motif des piles :')} ${cite(e.hors_piles)}. `
        + `${T`Pour les lire : « Réglages », « Convention du dépôt », « Piles » (<code>*</code> prend tout dossier).`}</p>` : '')
      + (e.profonds.length ? `<p>${N(e.profonds.length, '{n} sous-dossier de pile porte des archives sans être un dossier de la convention, il reste hors de la liste :', '{n} sous-dossiers de pile portent des archives sans être des dossiers de la convention, ils restent hors de la liste :')} ${cite(e.profonds)}.</p>` : '');
  }
  const GESTES = { parque: T('Parqué'), remonte: T('Remonté dans la pile'), retire: T('Retiré'), supprime: T('Supprimé'), renomme: T('Zip renommé'), convertit: T('Converti en .zip'), contenu: T('Contenu du zip renommé'),
    maj: T('Mis à jour'), arrive: T('Téléchargé de Nexus') };
  const FAITS = { 'posé': 'vert', 'retiré': 'rouge', 'mis à jour': 'ambre' };
  const ECRITS = { pose: (n) => N(n, '{n} posé', '{n} posés'), remplace: (n) => N(n, '{n} remplacé', '{n} remplacés'), retire: (n) => N(n, '{n} retiré', '{n} retirés'),
    lie: (n) => N(n, '{n} lié', '{n} liés'), delie: (n) => N(n, '{n} délié', '{n} déliés'), pris: (n) => N(n, '{n} pris au registre', '{n} pris au registre'),
    rendu: (n) => N(n, '{n} rendu au tiers', '{n} rendus au tiers'), modlist: (n) => `${n} modlist.txt` };
  /** Historique : une ligne par geste qui a écrit, du plus récent au plus ancien ; un « Appliquer » se déplie mod par mod. */
  function voletJournal(d) {
    E.volet = { t: 'journal' };
    const quand = (x) => { const [jour, heure] = String(x.date || '').slice(0, 16).split('T'); return `<span class="quand">${h(heure ? T`${jour} à ${heure}` : jour)}</span>`; };
    const feuille = (x) => String(x || '').split(/[\\/]/).pop();
    const dossier = (x) => String(x || '').split(/[\\/]/).slice(-2, -1)[0] || '';
    const connus = new Set(((E.data && E.data.mods) || []).map((r) => r.cle));
    const compte = (c) => Object.entries(c || {}).filter(([k]) => ECRITS[k]).map(([k, v]) => ECRITS[k](v)).join(T(', '));
    const ligne = (x, i) => {
      if (x.geste === 'reglages') {
        return `<li class="geste">${quand(x)}<b>${x.sens === 'restaure' ? T('Réglages restaurés') : T('Réglages sauvegardés')}</b> <code>${h(feuille(x.de))}</code>`
          + `<span class="vers">${N(x.fichiers || 0, '{n} fichier', '{n} fichiers')}${x.sens === 'restaure' ? ` ${T('remis dans le jeu')}` : ` ${T('copiés')}`}</span></li>`;
      }
      if (!x.mods) {
        return `<li class="geste">${quand(x)}<b>${h(GESTES[x.geste] || x.geste)}</b> <code>${h(feuille(x.de || x.vers))}</code>`
          + (x.geste === 'contenu' ? `<span class="vers">${N(x.renommes || 0, '{n} fichier sur {0} renommés dans le zip', '{n} fichiers sur {0} renommés dans le zip', x.fichiers || 0)}</span>`
            : x.geste === 'supprime' ? `<span class="vers">→ ${T('corbeille du système')}</span>`
            : x.geste === 'arrive' ? `<span class="vers">${T`dans le dossier ${h(dossier(x.vers))}`}</span>`
            : x.geste === 'renomme' || x.geste === 'convertit' || x.geste === 'maj' ? `<span class="vers">→ ${h(feuille(x.vers))}</span>` : `<span class="vers">→ ${T`dossier ${h(dossier(x.vers))}`}</span>`) + '</li>';
      }
      return `<li class="jour"><details${i ? '' : ' open'}><summary>${T`${quand(x)}<b>Appliqué</b> · profil ${h(x.profil || '')}${x.reel === false ? ` · ${T('jeu de banc')}` : ''} · ${h(compte(x.compte))}`}`
        + ((x.echecs || []).length ? ` · <span class="pastille rouge"></span>${N(x.echecs.length, '{n} échec de vérification', '{n} échecs de vérification')}` : '') + '</summary><ul>'
        + x.mods.map((m) => `<li><span class="pastille ${FAITS[m.fait] || 'gris'}"></span>${h(dit(m.fait))}${m.depuis ? ` ${T`(depuis ${h(m.depuis)})`}` : ''} : `
          + (connus.has(m.cle) ? `<button class="lien" data-va="${h(m.cle)}" title="${T`Ouvrir le détail de ce mod`}">${h(titreZip(m.cle))}</button>` : `<b>${h(titreZip(m.cle))}</b>`)
          + (m.version ? ` <small>${h(m.version)}</small>` : '') + ` <small>· ${h(m.cle.split('/')[0])} · ${h(compte(m))}</small></li>`).join('')
        + (x.mods.length ? '' : `<li>${T`Aucun fichier de mod : seul modlist.txt ou le registre a changé.`}</li>`)
        + (x.sauvegarde ? `<li><small>${T`Copies des fichiers écrasés : <code>${h(x.sauvegarde)}</code>`}</small></li>` : '') + '</ul></details></li>';
    };
    ouvre(T('Historique'), `<p class="faits">${d.total > d.entrees.length ? N(d.total, '{n} geste enregistré, les {0} plus récents montrés.', '{n} gestes enregistrés, les {0} plus récents montrés.', d.entrees.length) : N(d.total, '{n} geste enregistré.', '{n} gestes enregistrés.')} ${T`Lecture seule.`}</p>`
      + (d.entrees.length ? '<ul>' + d.entrees.map(ligne).join('') + '</ul>'
        : `<p class="vide">${T`Rien pour l\'instant. L\'historique commence avec cette version : chaque « Appliquer » et chaque geste sur le dépôt (parquer, remonter, renommer, convertir) s\'y ajoute. Les gestes d\'avant restent dans le journal texte.`}</p>`)
      + `<p><small>${T`Fichier : <code>${h(d.fichier)}</code>. Une session Claude le lit par l'outil <code>red_stack_journal</code>.`}</small></p>`);
  }

  function voletPlan(p) {
    E.volet = { t: 'plan', p };
    const c = p.compte, ecrit = c.pose + c.remplace + c.retire + c.lie + c.delie + (c.pris || 0) + (c.rendu || 0) + (c.modlist || 0);
    const parZip = {};
    for (const k of ['pose', 'remplace', 'retire', 'lie', 'delie']) for (const r of p[k]) (parZip[r.zip] = parZip[r.zip] || {})[k] = (parZip[r.zip][k] || 0) + 1;
    const mot = { pose: T('à poser'), remplace: T('à remplacer'), retire: T('à retirer'), lie: T('à lier'), delie: T('à délier') };
    const nMot = { pose: (n) => T`${n} à poser`, remplace: (n) => T`${n} à remplacer`, retire: (n) => T`${n} à retirer`, lie: (n) => T`${n} à lier`, delie: (n) => T`${n} à délier` };
    let b ='<div class="chiffres">'
      + `<span class="puce ${c.pose ? 'attente' : ''}">${T`${c.pose} à poser`}</span><span class="puce ${c.remplace ? 'attente' : ''}">${T`${c.remplace} à remplacer`}</span>`
      + `<span class="puce ${c.retire ? 'attente' : ''}">${T`${c.retire} à retirer`}</span>`
      + (c.lie || c.delie ? `<span class="puce attente">${T`${c.lie} à lier, ${c.delie} à délier`}</span>` : '')
      + (c.pris || c.rendu ? `<span class="puce attente" title="${T`Fichiers d'un installateur tiers que vous avez dits à un mod, ou rendus : seul le registre change, le fichier du jeu reste`}">${T`${c.pris || 0} à prendre au registre, ${c.rendu || 0} à rendre`}</span>` : '')
      + (c.modlist ? `<span class="puce attente" title="${T`Ordre de chargement des archives voulu par ce profil (onglet Conflits). Le fichier d'avant est copié dans les sauvegardes.`}">${p.modlist[0].action === 'ecrire' ? T`modlist.txt à écrire (${N(p.modlist[0].lignes.length, '{n} ligne', '{n} lignes')})` : T('modlist.txt à retirer du jeu')}</span>` : '')
      + `<span class="puce ok">${T`${p.ok} déjà en place`}</span>`
      + (p.tiers ? `<span class="puce" title="${T`Fichiers d'un installateur tiers : laissés tels quels`}">${T`${p.tiers} hors Red Stack`}</span>` : '')
      + (c.conflit ? `<span class="puce alerte">${N(c.conflit, '{n} conflit', '{n} conflits')}</span>` : '') + '</div>';
    if (p.jeu_lance) b += `<p><span class="puce alerte">${T`Le jeu tourne`}</span> ${T`Le fermer avant d\'appliquer.`}</p>`;
    const nomMod = (z) => { const l = lit(z.split('/').pop()); return h(l.titre) + (l.variante ? ' · ' + h(l.variante) : ''); };
    // liste repliée des fichiers ; dépliée, elle offre le choix fichier par fichier (l'exception, pas la règle)
    const fichiers = (lignes, zips, tenu) => `<details class="plis"><summary>${N(lignes.length, '{n} fichier · choisir fichier par fichier', '{n} fichiers · choisir fichier par fichier')}</summary><ul>`
      + lignes.map((d) => `<li><code>${h(d.dest)}</code><div class="choix rang">`
        + zips.map((z) => `<button class="mini${d.zip === z ? ' tenu' : ''}" data-gagne="${h(z)}" data-fichier="${h(d.dest)}"${d.zip === z && !d.seul ? ' disabled' : ''}`
          + ` title="${T`Ce fichier seul vient de ce mod`}">${d.zip === z ? '✓ ' : ''}${nomMod(z)}</button>`).join('')
        + (d.seul ? `<button class="mini" data-gagne="${h(d.zip)}" data-fichier="${h(d.dest)}" data-oublie="1" title="${T`Ce fichier suit de nouveau le choix fait entre les deux mods`}">${T`Suivre le choix global`}</button>` : '')
        + '</div></li>').join('') + '</ul></details>';
    const groupes = new Map();                       // une question par groupe de mods, pas par fichier
    for (const k of p.conflit) {
      const g = groupes.get(k.zips.join('|')) || { zips: k.zips, dests: [], jeu: k.dans_le_jeu };
      g.dests.push({ dest: k.dest, zip: '', seul: false });
      groupes.set(k.zips.join('|'), g);
    }
    if (groupes.size) b += `<h3>${N(groupes.size, '{n} conflit à trancher', '{n} conflits à trancher')}</h3>`;
    for (const g of groupes.values()) {
      b += `<div class="conflit"><div>${T`Ces mods actifs livrent les mêmes fichiers avec des contenus différents. Lequel gagne ? Un seul choix vaut pour tous leurs fichiers communs.`}</div><div class="choix">`
        + g.zips.map((z) => `<button data-gagne="${h(z)}" data-contre="${h(JSON.stringify(g.zips.filter((x) => x !== z)))}">${nomMod(z)}${g.jeu === z ? ` ${T('(dans le jeu)')}` : ''}</button>`).join('')
        + '</div>' + fichiers(g.dests, g.zips) + '</div>';
    }
    const faits = new Map();                         // choix déjà faits : gardés à l'écran, réversibles
    for (const t of p.tranche || []) for (const perdant of t.perdants) {
      const c = `${t.zip}|${perdant}|${t.par_fichier ? 1 : 0}`, g = faits.get(c) || { gagnant: t.zip, perdant, seul: !!t.par_fichier, dests: [] };
      g.dests.push({ dest: t.dest, zip: t.zip, seul: !!t.par_fichier });
      faits.set(c, g);
    }
    if (faits.size) b += `<details class="plis choisis" id="choixFaits"${E.choixOuverts ? ' open' : ''}><summary><h3>${N(faits.size, '{n} choix fait', '{n} choix faits')}</h3></summary>`;
    for (const g of faits.values()) {
      b += `<div class="conflit fait"><div><span class="pastille vert"></span>${T`<b>${nomMod(g.gagnant)}</b> gagne sur ${nomMod(g.perdant)}${g.seul ? ` <span class="puce">${T`choix par fichier`}</span>` : ''}`}</div>`
        + (g.seul ? '' : '<div class="choix rang">'
          + `<button data-gagne="${h(g.perdant)}" data-contre="${h(JSON.stringify([g.gagnant]))}">${T`Inverser`}</button>`
          + `<button data-gagne="${h(g.gagnant)}" data-contre="${h(JSON.stringify([g.perdant]))}" data-oublie="1">${T`Revenir à la question`}</button></div>`)
        + fichiers(g.dests, [g.gagnant, g.perdant]) + '</div>';
    }
    if (faits.size) b += '</details>';
    // mods coupés : une ligne chacun, même quand rien ne sort du jeu (ce qu'un autre mod reprend ou tient déjà)
    const coupes = p.coupes || [];
    if (coupes.length) {
      const parQui = (rows) => rows.map((x) => T('{0} par {1}', x.n, `<button class="lien" data-va="${h(x.zip)}">${nomMod(x.zip)}</button>`)).join(', ');
      b += `<h3>${N(coupes.length, '{n} mod coupé', '{n} mods coupés')}</h3><ul>` + coupes.map((k) => {
        const faits = [T`${k.retire} à retirer du jeu`];
        if (k.garde) faits.push(N(k.garde, '{n} modifié en jeu, gardé', '{n} modifiés en jeu, gardés'));
        if (k.rendu) faits.push(N(k.rendu, '{n} rendu à l\'installateur tiers', '{n} rendus à l\'installateur tiers'));
        if (k.repris.length) faits.push(T`repris à l'identique : ${parQui(k.repris)}`);
        if (k.tenu_par.length) faits.push(T`déjà tenus avec un autre contenu : ${parQui(k.tenu_par)}`);
        if (!k.retire && !k.repris.length && !k.tenu_par.length && !k.garde && !k.rendu) faits.push(T('aucun de ses fichiers n\'est dans le jeu'));
        return `<li><button class="lien" data-va="${h(k.zip)}">${nomMod(k.zip)}</button><div class="faits">${faits.join(' · ')}</div></li>`;
      }).join('') + '</ul>';
    }
    const zips = Object.entries(parZip);
    if (zips.length) {
      // un « à lier » qui vient d'un autre mod dit lequel : le fichier commun passe à l'arbre de celui qui le tient désormais
      // l'ancienne version du même mod se dit à part : ses fichiers inchangés passent à l'arbre de la nouvelle, rien n'est copié
      const repris = {}, version = new Set(), titre = (z) => lit(z.split('/').pop()).titre;
      for (const r of p.lie) if (r.ancien) { if (titre(r.ancien) === titre(r.zip)) version.add(r.zip); else (repris[r.zip] = repris[r.zip] || new Set()).add(r.ancien); }
      const detailMod = (z) => `<details class="plis"><summary>${T`Voir les fichiers`}</summary><ul>`
        + ['pose', 'remplace', 'retire', 'lie', 'delie'].map((k) => p[k].filter((r) => r.zip === z).map((r) => `<li><span class="etatf">${mot[k]}</span><code>${h(r.dest)}</code></li>`).join('')).join('') + '</ul></details>';
      b += `<h3>${T`Par mod`}</h3><ul>` + zips.map(([z, n]) => `<li><span class="etatf">${Object.entries(n).map(([k, v]) => nMot[k](v)).join(T(', '))}</span>`
        + `<button class="lien" data-va="${h(z)}">${h(lit(z.split('/').pop()).titre)}</button>`
        + (version.has(z) ? `<div class="faits">${T`à lier : fichiers inchangés depuis la version d'avant, rattachés à l'arbre de la nouvelle (rien n'est copié)`}</div>` : '')
        + (repris[z] ? `<div class="faits">${T`à lier : fichiers communs repris de ${[...repris[z]].map(nomMod).join(', ')}, liés désormais à l'arbre de ce mod`}</div>` : '')
        + detailMod(z) + '</li>').join('') + '</ul>';
    } else if (!c.conflit && !ecrit) {
      b += `<p class="vide">${T`Le jeu correspond au profil : rien à écrire.`}</p>`;
    }
    const plis = (titre, lignes) => (lignes.length ? `<details class="plis"><summary>${titre}</summary><ul>${lignes.join('')}</ul></details>` : '');
    b += plis(N(c.garde_modifie, '{n} fichier modifié en jeu, gardé tel quel', '{n} fichiers modifiés en jeu, gardés tels quels'),
      p.garde_modifie.map((r) => `<li><span class="etatf">${h(r.raison || '')}</span><code>${h(r.dest)}</code></li>`));
    b += plis(N(c.inconnu, '{n} fichier présent mais pas posé par Red Stack, laissé en place', '{n} fichiers présents mais pas posés par Red Stack, laissés en place'),
      p.inconnu.map((r) => `<li><span class="etatf">${nomMod(r.zip)}</span><code>${h(r.dest)}</code> <button class="mini" data-remplace="${h(r.dest)}" title="${T`À l'application, ce fichier du jeu sera remplacé par celui du zip ; l'ancien est d'abord copié dans le dossier des sauvegardes`}">${T`Remplacer par le zip`}</button></li>`)
        .concat(p.inconnu.length > 1 ? [`<li><button class="mini" data-remplace-tous="1">${T`Tout remplacer par les zips`}</button></li>`] : []));
    // fichiers présents que l'utilisateur a désignés : ils sont dans « à remplacer », dits ici pour pouvoir y revenir
    const forces = p.remplace.filter((r) => r.force);
    if (forces.length) b += `<details class="plis" open><summary>${N(forces.length, '{n} fichier présent sera remplacé par celui du zip, l\'ancien copié dans les sauvegardes', '{n} fichiers présents seront remplacés par ceux des zips, les anciens copiés dans les sauvegardes')}</summary><ul>`
      + forces.map((r) => `<li><span class="etatf">${nomMod(r.zip)}</span><code>${h(r.dest)}</code> <button class="mini" data-laisse="${h(r.dest)}">${T`Laisser en place`}</button></li>`).join('') + '</ul></details>';
    b += plis(N(c.retouche, '{n} retouche d\'un arbre, posée telle quelle', '{n} retouches d\'un arbre, posées telles quelles'),
      p.retouche.map((r) => `<li><code>${h(r.entree)}</code></li>`));
    b += plis(N(c.pris || 0, '{n} fichier d\'un installateur tiers pris au registre pour un mod', '{n} fichiers d\'un installateur tiers pris au registre pour un mod'),
      (p.pris || []).map((r) => `<li><span class="etatf">${nomMod(r.zip)}${r.raison ? ' · ' + h(r.raison) : ''}</span><code>${h(r.dest)}</code></li>`));
    b += plis(N(c.rendu || 0, '{n} fichier rendu à l\'installateur tiers, laissé dans le jeu', '{n} fichiers rendus à l\'installateur tiers, laissés dans le jeu'),
      (p.rendu || []).map((r) => `<li><span class="etatf">${nomMod(r.zip)}</span><code>${h(r.dest)}</code></li>`));
    b += `<div class="pied"><button class="plein" data-applique="${h(p.empreinte)}"${ecrit && !c.conflit && !p.jeu_lance ? '' : ' disabled'}>${T`Appliquer au jeu…`}</button>`
      + `<span class="faits">${ecrit ? T('Une confirmation suit ; le jeu doit être fermé.') : ''}</span></div>`;
    ouvre(T`Plan du profil « ${h(E.profil)} »`, b);
    const cf = $('choixFaits');
    if (cf) cf.addEventListener('toggle', () => { E.choixOuverts = cf.open; });
  }

  // ---------------------------------------------------------------- conflits d'archives (lecture seule)
  // Le jeu prend chaque ressource dans la première archive chargée : une archive gagne sur celles chargées après elle,
  // perd contre celles d'avant ; les copies identiques sont à part. E.cf = réponse du moteur, relue avec chaque état.
  const titreZip = (z) => lit(z.split('/').pop()).titre;
  /** Un bouton d'en-tête qui ouvre une vue entière devient, vue ouverte, le bouton plein du retour à la liste. */
  function boutonVue(id, ouvert) {
    const b = $(id);
    if (!b.dataset.mot) b.dataset.mot = b.textContent;
    b.setAttribute('aria-pressed', String(ouvert));
    b.classList.toggle('plein', ouvert);
    b.textContent = ouvert ? T('← Liste des mods') : b.dataset.mot;
  }
  const nomModArch = (a) => (a.zip ? titreZip(a.zip) : a.genre === 'hors' ? T('hors Red Stack') : '');
  /** Par mod (zip) : contre quels autres mods il gagne et perd, en ressources. Les conflits internes à un mod sont à part. */
  function conflitsParMod() {
    const d = E.cf, par = new Map();
    if (!d) return par;
    const de = (z) => par.get(z) || par.set(z, { gagne: new Map(), perd: new Map(), g: 0, p: 0, interne: 0 }).get(z);
    for (const x of d.paires) {
      const a = d.ordre[x.gagnant], b = d.ordre[x.perdant];
      if (!x.conflits) continue;
      const za = a.zip || 'hors:' + a.archive, zb = b.zip || 'hors:' + b.archive;
      if (za === zb) { de(za).interne += x.conflits; continue; }
      de(za).gagne.set(zb, (de(za).gagne.get(zb) || 0) + x.conflits); de(za).g += x.conflits;
      de(zb).perd.set(za, (de(zb).perd.get(za) || 0) + x.conflits); de(zb).p += x.conflits;
    }
    return par;
  }
  const nomCle = (z) => (z.startsWith('hors:') ? z.slice(5) + ` ${T('(hors Red Stack)')}` : titreZip(z));
  function pastilleConflits(cle) {
    const m = E.cfMods && E.cfMods.get(cle);
    if (!m || !(m.g || m.p || m.interne)) return '';
    return `<span class="cf" data-cf="${h(cle)}">${m.p ? `<b class="mot rouge">▼ ${m.p}</b>` : ''}${m.g ? `<b class="mot vert">▲ ${m.g}</b>` : ''}`
      + `${m.interne ? `<b class="mot ambre">⇄ ${m.interne}</b>` : ''}</span>`;
  }
  function bulleConflits(cle) {
    const m = E.cfMods.get(cle);
    const liste = (titre, ton, map) => (map.size ? `<h4><span class="pastille ${ton}"></span>${titre}</h4>`
      + [...map].sort((x, y) => y[1] - x[1]).slice(0, 12).map(([z, n]) => `<div>${h(nomCle(z))} <small>· ${N(n, '{n} ressource', '{n} ressources')}</small></div>`).join('')
      + (map.size > 12 ? `<div><small>${N(map.size - 12, '… et {n} autre', '… et {n} autres')}</small></div>` : '') : '');
    return liste(T('Perd contre (chargés avant lui)'), 'rouge', m.perd) + liste(T('Gagne sur (chargés après lui)'), 'vert', m.gagne)
      + (m.interne ? `<h4><span class="pastille ambre"></span>${T`Entre ses propres archives`}</h4><div>${N(m.interne, '{n} recouvrement', '{n} recouvrements')} <small>· ${T`la première chargée gagne`}</small></div>` : '')
      + `<div><small>${T`Clic : ouvrir l\'analyse des conflits sur ce mod, dans son onglet`}</small></div>`;
  }

  // ---- Scripts et tweaks : conflits de CODE du profil (Redscript, TweakXL, SetFlat littéral), lus à la demande. E.conf.code = réponse du moteur.
  const NIV = { attention: [T('à regarder'), 'rouge'], revoir: [T('à revoir'), 'ambre'], rien: [T('sans action'), 'gris'], info: [T('sans action'), 'gris'] };
  const SORTES = {
    'redscript:remplacement': [T('méthode remplacée par plusieurs mods'), T('Plusieurs @replaceMethod au corps différent visent la même méthode : une seule version tourne, les autres sont perdues.')],
    'redscript:double': [T('déclaration en double'), T('La même méthode ou le même champ est ajouté plusieurs fois (@addMethod, @addField) : le compilateur Redscript peut refuser les scripts.')],
    'redscript:coupe': [T('chaîne d\'enveloppes coupée'), T('Une @wrapMethod n\'appelle pas wrappedMethod : pour les autres mods qui enveloppent la même méthode, elle agit comme un remplacement.')],
    'redscript:ajout': [T('méthode ajoutée, puis enveloppée'), T('Un mod ajoute la méthode, d\'autres l\'enveloppent : fait pour aller ensemble.')],
    'redscript:compose': [T('enveloppes qui s\'enchaînent'), T('Chaque @wrapMethod appelle la suivante : compatibles.')],
    'redscript:identique': [T('remplacements identiques'), T('Les @replaceMethod ont le même corps : le résultat est le même quel que soit le gagnant.')],
    'tweak:valeur': [T('même propriété, valeurs différentes'), T('La même propriété reçoit des valeurs différentes : une seule reste dans le jeu.')],
    'tweak:oppose': [T('ajout contre retrait'), T('Un fichier ajoute une valeur à une liste, un autre la retire : le résultat dépend de l\'ordre de chargement des tweaks.')],
    'tweak:liste': [T('liste posée différemment'), T('La même liste est posée en entier, ou changée, de façons qui ne se composent pas : des entrées peuvent se perdre.')],
    'tweak:doublon': [T('entrée ajoutée en double'), T('La même valeur est ajoutée plusieurs fois à une liste sans garde (!append au lieu de !append-once) : elle peut s\'y trouver en double.')],
    'tweak:definition': [T('définitions concurrentes'), T('Le même enregistrement est défini plusieurs fois ($type, $base), avec des contenus différents.')],
    'tweak:copie': [T('liste copiée, changée ailleurs'), T('Une liste est copiée d\'une autre (!append-from) qu\'un autre mod change : la copie dépend de l\'ordre de chargement.')],
    'code:code': [T('SetFlat contre tweak'), T('Un script écrit cette valeur en dur (SetFlat) alors qu\'un autre mod la fixe autrement : le code passe après les tweaks.')],
    'tweak:interne': [T('dans un même mod'), T('Le même mod pose cette propriété plusieurs fois : affaire de son auteur.')],
    'tweak:compose': [T('ajouts compatibles'), T('Chaque mod ajoute ses entrées à la liste : elles se composent.')],
    'tweak:identique': [T('mêmes valeurs'), T('Les mods posent la même valeur : rien ne se perd.')],
    'tweak:puis': [T('liste posée, puis complétée'), T('Un mod pose la liste, d\'autres y ajoutent : les ajouts s\'appliquent à la suite.')],
  };
  const VOIES = { redscript: T('Redscript'), tweak: 'TweakXL', code: T('Code') };
  const nomProv = (p) => (p.startsWith('hors:') ? p.slice(5) + ` ${T('(hors Red Stack)')}` : titreZip(p));
  const mot = (k) => (SORTES[k] || [k.split(':')[1]])[0];
  function dessineCode() {
    const C = E.conf, d = C.code;
    const retour = `<div class="grille"><button data-archfen="1" title="${T`Les conflits dans les archives ont leur onglet : l\'ouvrir, ou le ramener devant`}">${T`Conflits d\'archives…`}</button></div>`;
    if (!d) {
      if (!C.codeDemande && !C.codeEchec) { C.codeDemande = true; vscode.postMessage({ t: 'conflitsCode' }); }
      $('conflits').innerHTML = `<div class="intro">${retour}</div><p class="vide">${C.codeEchec
        ? `${T`La lecture des scripts a échoué (message en haut de l\'onglet).`} <button class="lien" data-crelit="1">${T`Relire`}</button>`
        : T('Lecture des scripts et des tweaks du profil… La première fois, quelques dizaines de secondes ; ensuite quelques secondes.')}</p>`;
      return;
    }
    const c = d.compte, n = (k) => c[k] || 0, t = $('cherche').value.trim().toLowerCase();
    const niv = C.cNiv || 'agir', veut = { agir: ['attention', 'revoir'], attention: ['attention'], revoir: ['revoir'], rien: ['rien', 'info'] }[niv] || [];
    const duNiveau = d.trouvailles.map((x, i) => ({ x, i })).filter((r) => veut.includes(r.x.niveau));
    const sortes = new Map();
    for (const r of duNiveau) { const k = r.x.voie + ':' + r.x.sorte; sortes.set(k, (sortes.get(k) || 0) + 1); }
    if (C.cSorte && !sortes.has(C.cSorte)) C.cSorte = '';
    const voit = (x) => (!C.cSorte || x.voie + ':' + x.sorte === C.cSorte) && (!t || x.cible.toLowerCase().includes(t)
      || x.provs.some((p) => p.toLowerCase().includes(t) || nomProv(p).toLowerCase().includes(t)) || x.lignes.some((l) => l.fichier.toLowerCase().includes(t)));
    const puce = (k, texte, ton, titre) => `<button class="puce ${ton}${niv === k ? ' on' : ''}" data-cniv="${k}" title="${h(titre)}">${texte}</button>`;
    const html = ['<div class="intro"><div class="chiffres">'
      + puce('attention', T`${n('attention')} à regarder`, n('attention') ? 'alerte' : 'ok', T('Un mod efface à coup sûr le travail d\'un autre. Le clic ne montre qu\'elles ; un second clic revient à la vue de départ.'))
      + puce('revoir', T`${n('revoir')} à revoir`, n('revoir') ? 'attente' : 'ok', T('Le résultat dépend de l\'ordre de chargement, ou peut gêner : à juger au cas par cas.'))
      + puce('rien', T`${n('rien') + n('info')} sans action`, '', T('Plusieurs mods touchent au même endroit d\'une façon qui se compose : rien à faire.'))
      + puce('limites', N(d.limites.length, '{n} limite de lecture', '{n} limites de lecture'), '', T('Fichiers posés que cette analyse n\'a pas pu lire en entier : leurs conflits éventuels ne sont pas dans les chiffres.'))
      + `<span class="puce" title="${T`Ce que l'analyse a lu : ce que le profil veut dans le jeu, plus les fichiers posés hors Red Stack`}">${T`lus : ${N(d.lus.reds, '{n} script', '{n} scripts')} Redscript · ${N(d.lus.tweaks, '{n} tweak', '{n} tweaks')} · ${N(d.lus.lua, '{n} fichier', '{n} fichiers')} Lua de CET`}</span>`
      + (d.a_appliquer ? `<span class="puce attente" title="${T`Cette analyse lit ce que le profil veut. Le jeu le suit après « Aperçu du plan » puis « Appliquer », dans la page.`}">${N(d.a_appliquer, '{n} changement à appliquer au jeu', '{n} changements à appliquer au jeu')}</span>` : '')
      + '</div>' + retour
      + (niv === 'limites' ? '' : `<div class="grille"><span>${T`Sorte`}</span>` + [...sortes].sort((a, b) => b[1] - a[1]).map(([k, nb]) =>
        `<button data-csorte="${h(k)}" class="${C.cSorte === k ? 'on' : ''}" aria-pressed="${C.cSorte === k}" title="${h((SORTES[k] || ['', ''])[1])}">${h(VOIES[k.split(':')[0]] || '')} · ${h(mot(k))} <small>${nb}</small></button>`).join('') + '</div>')
      + `<p>${T`<b>Conflit de code</b> : deux mods touchent la même méthode Redscript ou la même propriété TweakDB. Deux mods qui posent un fichier au même chemin sont un écrasement de fichier : il se lit dans l\'aperçu du plan, pas ici.`}</p>`
      + `<p>${T`D\'office, la liste montre ce qui est à regarder et à revoir ; les puces de chiffres se cliquent. Le champ de filtre prend un nom de mod, de méthode, de propriété ou de fichier.`} `
      + `${T`Dépliez une ligne pour voir qui écrit quoi ; le nom d\'un fichier l\'ouvre à la bonne ligne. Lecture seule : rien n\'est changé.`}</p>`
      + `<p>${T`Le « dernier mot » annoncé est <b>prévu</b> d\'après l\'ordre des noms de fichiers, jamais observé dans le jeu.`} `
      + `${T`Pas lus ici : les recoupements Lua de CET (Override, Observe), les chaînes ArchiveXL, une enveloppe qui rend la main avant d\'appeler wrappedMethod, les fichiers <code>.tweak</code> au format RED.`}</p>`
      + '</div>'];
    const haut = $('conflits').scrollTop;
    const pose = (corps) => { $('conflits').innerHTML = html.join('') + corps; $('conflits').scrollTop = haut; };
    if (niv === 'limites') {
      const lues = d.limites.filter((l) => !t || l.fichier.toLowerCase().includes(t) || nomProv(l.prov).toLowerCase().includes(t) || l.quoi.toLowerCase().includes(t));
      return pose(`<p class="compte">${N(lues.length, '{n} fichier sur {0} que l\'analyse n\'a pas lus en entier.', '{n} fichiers sur {0} que l\'analyse n\'a pas lus en entier.', d.limites.length)}</p><ul>`
        + lues.map((l) => `<li class="ress"><code>${h(l.fichier)}</code><div><b>${h(nomProv(l.prov))}</b> · ${h(l.quoi)}</div></li>`).join('') + '</ul>'
        + (lues.length ? '' : `<p class="vide">${T`Rien ne correspond à ce filtre.`}</p>`));
    }
    const lues = duNiveau.filter((r) => voit(r.x)), MAX = 300;
    pose(`<p class="compte">${lues.length > MAX ? N(lues.length, '{n} conflit de code sur {0}, {1} montrés : affinez par une sorte ou par le champ de filtre.', '{n} conflits de code sur {0}, {1} montrés : affinez par une sorte ou par le champ de filtre.', duNiveau.length, MAX) : N(lues.length, '{n} conflit de code sur {0}.', '{n} conflits de code sur {0}.', duNiveau.length)}</p>`
      + lues.slice(0, MAX).map(({ x, i }) => {
        const id = 'c:' + i, ouvert = C.deplies.has(id), k = x.voie + ':' + x.sorte, niv = NIV[x.niveau] || NIV.rien;
        const tete = `<details class="arch code" data-groupe="${id}"${ouvert ? ' open' : ''}><summary><span class="pastille ${niv[1]}" title="${niv[0]}"></span>`
          + `<b>${h(mot(k))}</b><code>${h(x.cible)}</code><span class="du">${h(x.provs.map(nomProv).join(' · '))}</span>`
          + `<span class="bilan">${h(VOIES[x.voie] || x.voie)} · ${N(x.lignes.length + (x.plus || 0), '{n} ligne', '{n} lignes')}</span></summary>`;
        if (!ouvert) return tete + '</details>';
        const dernier = x.gagnant != null ? x.lignes[x.gagnant] : null;
        return tete + `<div class="corps"><p>${h((SORTES[k] || ['', ''])[1])}</p>`
          + (dernier ? `<p><span class="pastille vert"></span>${T`Dernier mot prévu : <b>${h(nomProv(dernier.prov))}</b>`} <small>· ${T`${h(x.raison || '')} · prévu, pas observé en jeu`}</small></p>`
            : x.raison ? `<p><span class="pastille gris"></span>${T`Dernier mot non prévu`} <small>· ${h(x.raison)}</small></p>` : '')
          + '<ul>' + x.lignes.map((l, j) => `<li class="site${j === x.gagnant ? ' gagne' : ''}">`
            + (l.prov.startsWith('hors:') ? `<b>${h(nomProv(l.prov))}</b>` : `<button class="lien" data-va="${h(l.prov)}" title="${T`Ouvrir le détail de ce mod`}">${h(nomProv(l.prov))}</button>`)
            + (l.chemin ? ` <button class="lien fich" data-ouvre="${h(l.chemin)}" data-ligne="${l.ligne}" title="${T`Ouvrir ce fichier du jeu à la ligne ${l.ligne}`}">${h(l.fichier)}:${l.ligne}</button>`
              : ` <small title="${T`Ce fichier n'est pas encore dans le jeu : il sera posé au prochain « Appliquer »`}">${T`${h(l.fichier)}:${l.ligne} · pas encore posé`}</small>`)
            + `<div><code>${h(l.geste)}</code>${l.valeur ? ` <code class="val">${h(l.valeur)}</code>` : ''}</div></li>`).join('')
          + (x.plus ? `<li class="site"><small>${T`… et ${N(x.plus, '{n} autre ligne', '{n} autres lignes')} du même genre`}</small></li>` : '')
          + '</ul></div></details>';
      }).join('') + (lues.length ? '' : `<p class="vide">${duNiveau.length ? T('Rien ne correspond à ces filtres.') : niv === 'agir' ? T('Aucun conflit de code à regarder ni à revoir dans ce profil.') : T('Rien à ce niveau.')}</p>`));
  }

  function dessineConflits() {
    const C = E.conf, d = E.cf;
    if (!C) return;
    if (C.grille === 'code') return dessineCode();
    if (!d) { $('conflits').innerHTML = `<p class="vide">${T`Lecture des archives du profil…`}</p>`; return; }
    const o = d.ordre, c = d.compte, t = $('cherche').value.trim().toLowerCase();
    // filtre par ressource : les archives qui portent une ressource (en conflit ou en copie identique) dont le chemin contient le texte
    let parFichier = null;
    if (t.length >= 3 && C.res) {
      parFichier = new Set();
      for (const r of C.res.ressources.concat(C.res.identiques || [])) {
        if (r.ressource.toLowerCase().includes(t)) for (const i of [r.prise_dans, ...r.perd, ...r.identiques]) parFichier.add(i);
      }
    } else if (t.length >= 3 && !C.resDemande) { C.resDemande = true; vscode.postMessage({ t: 'conflitsRessources' }); }
    const touche = (rangs) => !!parFichier && [...rangs].some((i) => parFichier.has(i));
    // groupes : une archive, ou toutes les archives d'un mod ; paires utiles à chacun
    const groupes = new Map();
    for (const a of o) {
      const id = C.grille === 'mod' ? (a.zip || 'hors:' + a.archive) : String(a.rang);
      const g = groupes.get(id) || groupes.set(id, { id, rangs: new Set(), premier: a, gagne: [], perd: [], egal: [], g: 0, p: 0, e: 0, base: 0, total: 0, perdues: 0 }).get(id);
      g.rangs.add(a.rang);
      g.base += a.base || 0;
      g.total += a.ressources || 0;                  // ce que le groupe livre, et ce qu'une archive chargée avant lui prend
      g.perdues += a.perd || 0;
    }
    const idDe = (i) => (C.grille === 'mod' ? (o[i].zip || 'hors:' + o[i].archive) : String(i));
    for (const x of d.paires) {
      const ga = groupes.get(idDe(x.gagnant)), gb = groupes.get(idDe(x.perdant));
      if (ga === gb || (x.meme_mod && !C.internes)) continue;
      if (x.conflits) { ga.gagne.push(x); ga.g += x.conflits; gb.perd.push(x); gb.p += x.conflits; }
      if (x.identiques) { ga.egal.push(x); gb.egal.push(x); ga.e += x.identiques; gb.e += x.identiques; }
    }
    // par archive, tout montré : le bilan compte des ressources distinctes (une ressource perdue contre deux archives = 1)
    if (C.grille === 'archive' && C.internes) for (const g of groupes.values()) { g.p = g.premier.perd; g.g = g.premier.gagne; }
    const bloc = (g, titre, ton, paires, champ) => {
      if (!paires.length) return '';
      return `<h4><span class="pastille ${ton}"></span>${titre}</h4><ul>` + paires.map((x) => {
        const mien = o[g.rangs.has(x.gagnant) ? x.gagnant : x.perdant], autre = o[mien.rang === x.gagnant ? x.perdant : x.gagnant];
        const n = champ === 'identique_a' ? x.identiques : x.conflits;
        const cle = `${mien.rang}|${autre.rang}|${champ}`, det = C.details[mien.archive];
        let res = champ === 'identique_a' ? [] : x.exemples, tout = n <= res.length;
        if (C.ouverts.has(cle) && det) { res = det.ressources.filter((r) => r.archive === mien.rang && r[champ].includes(autre.rang)).map((r) => r.ressource); tout = true; }
        const sens = champ === 'perd_contre' ? 'avant' : champ === 'gagne_sur' ? 'apres' : '';
        return `<li class="paire"><b>${h(autre.archive)}</b><small>${h(nomModArch(autre))}${x.meme_mod ? ` · ${T('même mod')}` : ''} · ${T`rang ${autre.rang + 1}`}</small>`
          + (g.rangs.size > 1 ? `<small>via ${h(mien.archive)}</small>` : '') + `<small>${N(n, '{n} ressource', '{n} ressources')}</small>`
          + (sens && mien.genre !== 'redmod' && autre.genre !== 'redmod'
            ? ` <button class="lien" data-passe="${h(mien.archive)}" data-cible="${h(autre.archive)}" data-sens="${sens}" title="${sens === 'avant'
              ? T`Charger ${h(mien.archive)} avant ${h(autre.archive)} : elle gagnera sur elle. Par un nouveau nom dans le jeu, ou par modlist.txt ; rien n'est écrit sans votre choix.`
              : T`Charger ${h(mien.archive)} après ${h(autre.archive)} : elle perdra contre elle.`}">${sens === 'avant' ? T('Passer devant…') : T('Passer derrière…')}</button>` : '')
