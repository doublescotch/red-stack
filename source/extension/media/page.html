          + (tout ? '' : ` <button class="lien" data-tout="${h(cle)}" data-archive="${h(mien.archive)}">${C.ouverts.has(cle) ? T('lecture…') : T('tout voir')}</button>`)
          + (res.length ? `<ul class="res">${res.map((r) => `<li><code>${h(r)}</code></li>`).join('')}</ul>` : '') + '</li>';
      }).join('') + '</ul>';
    };
    const vues = [...groupes.values()].filter((g) => (C.montre === 'perd' ? g.p : C.montre === 'gagne' ? g.g : (g.g || g.p || (C.egaux && g.e)))
      && (!t || g.premier.archive.toLowerCase().includes(t) || (g.premier.zip || '').toLowerCase().includes(t) || touche(g.rangs)));
    if (C.tri === 'perd') vues.sort((a, b) => b.p - a.p); else if (C.tri === 'gagne') vues.sort((a, b) => b.g - a.g);
    const bouton = (attr, v, mot, actif) => `<button ${attr}="${v}" class="${actif ? 'on' : ''}" aria-pressed="${actif}">${mot}</button>`;
    const html = ['<div class="intro"><div class="chiffres">'
      + `<button class="puce${C.grille === 'archive' ? ' on' : ''}" data-puce="archives" title="${T`Montrer les archives, dans l'ordre de chargement`}">${T`${c.archives} archives chargées`}</button>`

      + `<div class="grille"><span>${T`Lire`}</span>` + bouton('data-grille', 'archive', T('par archive'), C.grille === 'archive') + bouton('data-grille', 'mod', T('par mod'), C.grille === 'mod')
      + bouton('data-grille', 'paires', T('par paire de mods'), C.grille === 'paires') + bouton('data-grille', 'archives', T("par paire d'archives"), C.grille === 'archives')

      + `<p>${T`<b>Archive</b> : un fichier <code>.archive</code> posé par un mod. <b>Ressource</b> : ce qu\'une archive contient (mesh, texture, apparence…), désigné par son chemin dans le jeu.`} `

      + `${T`Deux copies au contenu identique ne sont pas un conflit. Le champ de filtre prend un nom de mod, un nom d\'archive ou un bout de chemin de ressource (trois lettres au moins) ; les puces de chiffres se cliquent.`}</p>`

    const pose = (corps, vide) => {

      const lues = d.paires.filter((x) => x.conflits && (C.internes || !x.meme_mod) && (!t || [x.gagnant, x.perdant].some((i) =>
        o[i].archive.toLowerCase().includes(t) || (o[i].zip || '').toLowerCase().includes(t)) || (touche([x.gagnant]) && touche([x.perdant])))).sort((a, b) => b.conflits - a.conflits);
      return pose(`<p class="compte">${N(lues.length, '{n} paire d\'archives sur {0}.', '{n} paires d\'archives sur {0}.', c.paires)}</p><ul>` + lues.map((x) => {
        const ga = o[x.gagnant], pe = o[x.perdant], cle = `${ga.rang}|${pe.rang}|gagne_sur`, det = C.details[ga.archive];
        let res = x.exemples, tout = x.conflits <= res.length;
        if (C.ouverts.has(cle) && det) { res = det.ressources.filter((r) => r.archive === ga.rang && r.gagne_sur.includes(pe.rang)).map((r) => r.ressource); tout = true; }
        return `<li class="paire"><b>${h(ga.archive)}</b><small>${h(nomModArch(ga))} · rang ${ga.rang + 1}</small><span class="verbe">${T`gagne sur`}</span><b>${h(pe.archive)}</b><small>${h(nomModArch(pe))} · rang ${pe.rang + 1}</small>`
          + `<small>${N(x.conflits, '{n} ressource', '{n} ressources')}${x.identiques ? ` · ${N(x.identiques, '{n} copie identique', '{n} copies identiques')}` : ''}</small>`
          + (tout ? '' : ` <button class="lien" data-tout="${h(cle)}" data-archive="${h(ga.archive)}">${C.ouverts.has(cle) ? T('lecture…') : T('tout voir')}</button>`)
          + `<ul class="res">${res.map((r) => `<li><code>${h(r)}</code></li>`).join('')}</ul></li>`;
      }).join('') + '</ul>', lues.length ? '' : (c.en_conflit ? T('Rien ne correspond à ce filtre.') : T('Aucun conflit entre les archives de ce profil.')));
    }
    if (C.grille === 'ressource') {
      // une ligne par ressource en conflit : l'archive où le jeu la prend, celles qui la perdent
      if (!C.res) {
        if (!C.resDemande) { C.resDemande = true; vscode.postMessage({ t: 'conflitsRessources' }); }
        return pose('', T('Lecture des ressources en conflit…'));
      }
      const ro = C.res.ordre, de = (i) => `<b>${h(ro[i].archive)}</b> <small>${h(nomModArch(ro[i]))}</small>`;
      const voit = (r) => (!C.baseSeul || r.base) && (!t || r.ressource.toLowerCase().includes(t)
        || [r.prise_dans, ...r.perd].some((i) => ro[i].archive.toLowerCase().includes(t) || (ro[i].zip || '').toLowerCase().includes(t)));
      const egales = C.resMode === 'identiques', source = egales ? (C.res.identiques || []) : C.res.ressources;
      const lues = source.filter(voit), MAX = 400;
      const nb = N(lues.length, '{n} ressource', '{n} ressources'), trop = lues.length > MAX;

        : (trop ? T`${nb} sur ${source.length} en conflit, ${MAX} montrées : affinez par le champ de filtre (un bout de chemin, une archive, un mod).` : T`${nb} sur ${source.length} en conflit.`);
      return pose(`<p class="compte">${compte}</p><ul>`
        + lues.slice(0, MAX).map((r) => `<li class="ress"><code>${h(r.ressource)}</code>`
          + (r.base ? ` <span class="puce attente" title="${T`Ce chemin existe dans les archives du jeu de base : la ressource le remplace`}">${T`remplace le jeu de base`}</span>` : '')
          + `<div><span class="pastille vert"></span>${T`prise dans ${de(r.prise_dans)}`}</div>`
          + r.perd.map((i) => `<div><span class="pastille rouge"></span>${T`perdue par ${de(i)}`}</div>`).join('')
          + r.identiques.map((i) => `<div><span class="pastille gris"></span>${T`copie identique dans ${de(i)}`}</div>`).join('') + '</li>').join('') + '</ul>',
      lues.length ? '' : T('Rien ne correspond à ce filtre.'));
    }
    for (const g of vues) {
      const a = g.premier, ouvert = C.deplies.has(g.id);
      const titre = C.grille === 'mod' ? h(nomCle(g.id)) : h(a.archive);
      const renommee = C.grille !== 'mod' && a.origine && a.origine !== a.archive;
      const sous = (C.grille === 'mod' ? N(g.rangs.size, '{n} archive · à partir du rang {0}', '{n} archives · à partir du rang {0}', a.rang + 1) : h(nomModArch(a)) + (a.genre === 'redmod' ? ' · REDmod' : '')
        + (renommee ? ` · ${T`nom de l'auteur : ${h(a.origine)}`}` : ''))
        + (g.total ? ` · ${N(g.total, '{n} ressource', '{n} ressources')}` : '')
        + (g.total && g.perdues ? ` · ${N(Math.max(0, g.total - g.perdues), '{n} encore servie au jeu', '{n} encore servies au jeu')}` : '')
        + (g.base ? ` · ${N(g.base, '{n} du jeu de base remplacée', '{n} du jeu de base remplacées')}` : '');
      html.push(`<details class="arch" data-groupe="${h(g.id)}"${ouvert ? ' open' : ''}><summary><span class="rang">${a.rang + 1}</span><b>${titre}</b>`
        + `<span class="du">${sous}</span><span class="bilan">`
        + (g.p ? `<b class="mot rouge">▼ ${T`perd ${g.p}`}</b>` : '') + (g.g ? `<b class="mot vert">▲ ${T`gagne ${g.g}`}</b>` : '')
        + (C.egaux && g.e ? `<b class="mot">= ${g.e}</b>` : '') + '</span></summary>'
        + (ouvert ? '<div class="corps">'
          + (a.zip ? `<button class="lien" data-va="${h(a.zip)}">${T`Ouvrir le détail du mod`}</button>` : '')
          + (C.grille === 'archive' && a.zip && a.genre === 'mod' ? ` <button class="lien" data-renomme="${h(a.archive)}" title="${T`Donner à cette archive un autre nom DANS LE JEU (le zip ne change pas) : son nom décide de sa place dans l'ordre de chargement`}">${T`Renommer dans le jeu…`}</button>`
            + (renommee ? ` <button class="lien" data-rendnom="${h(a.archive)}">${T`Rendre le nom de l'auteur`}</button>` : '') : '')
          + bloc(g, T('Perd contre (chargées avant)'), 'rouge', g.perd, 'perd_contre') + bloc(g, T('Gagne sur (chargées après)'), 'vert', g.gagne, 'gagne_sur')

    }
    const haut = $('conflits').scrollTop;
    $('conflits').innerHTML = html.join('') + (vues.length ? '' : `<p class="vide">${c.en_conflit ? T('Rien ne correspond à ces filtres.') : T('Aucun conflit entre les archives de ce profil.')}</p>`);
    $('conflits').scrollTop = haut;
  }
  // ---- Arrivages : archives des dossiers « nouveaux », noms de l'application Nexus, .7z / .rar. Le moteur propose un
  // nom ; l'utilisateur le retouche dans le champ, coche, puis renomme (confirmation dans VS Code). E.arr = état de la vue.
  const STATUT = { a_renommer: [T('à renommer'), 'attente'], doute: [T('à trancher'), 'alerte'], conforme: [T('conforme'), 'ok'], hors_nexus: [T('hors Nexus'), ''] };
  /** Colonnes « Dossier » et « État » d'une vue : leur largeur suit le texte le plus long (mesuré, la table est à largeurs fixes),

  /** Mises à jour : un zip de la pile que le profil a coupé le dit sur sa ligne (il est comparé à Nexus comme les autres). */
  const coupeDit = (cle) => { const m = ((E.data && E.data.mods) || []).find((x) => x.cle === cle); return m && !m.actif && m.etat ? ` · <b>${h(dit(m.etat))}</b>` : ''; };

      + `<button class="plein" id="arrRenomme"${coches ? '' : ' disabled'}>${(coches ? N(coches, 'Renommer {n} archive cochée…', 'Renommer {n} archives cochées…') : T('Renommer les archives cochées…'))}</button>`
      + `<button id="arrRemonte"${haut_ ? '' : ' disabled'} title="${T`Déplacer les zips cochés à la racine de leur pile, en une confirmation`}">${T`Remonter ${haut_ ? N(haut_, '{n} cochée', '{n} cochées') : T('les cochées')}…`}</button>`
      + `<button id="arrParque"${bas_ ? '' : ' disabled'} title="${T`Déplacer les zips cochés dans le dossier des parqués de leur pile, en une confirmation`}">${T`Parquer ${bas_ ? N(bas_, '{n} cochée', '{n} cochées') : T('les cochées')}…`}</button>`
      + `<button id="arrRelit" title="${T`Relire les arrivages et redemander à Nexus les fichiers de ces mods`}">${T`Relire Nexus`}</button>`
      + Object.entries(d.compte).map(([s, n]) => `<span class="puce ${(STATUT[s] || ['', ''])[1]}">${n} ${(STATUT[s] || [s])[0]}</span>`).join('')
      + (A.dit ? `<span class="dit" role="status">${h(A.dit)}</span>` : '') + '</div>'
      + `<p>${T`Archives des dossiers d\'arrivée, noms au format de l\'application Nexus, et archives <code>.7z</code> / <code>.rar</code>.`} `
      + `${T`Le nom proposé suit la forme du site Nexus, <code>Nom-modId-version-horodatage.zip</code>, que Red Stack lit pour reconnaître un mod et ses mises à jour.`} `
      + `${T('Retouchez le nom dans le champ, cochez, puis renommez : seul le nom du fichier change, jamais son contenu.')} `
      + `${T`Un zip téléchargé à la main pour un mod déjà en place est reconnu comme sa mise à jour : « Ranger la mise à jour… » le met à sa place, sans clé d\'API.`}</p>`
      + (d.erreur ? `<p class="err">${T`${h(d.erreur)}. Les noms au format de l'application restent à trancher à la main.`}</p>` : '') + '</div>'];
    if (!d.lignes.length) html.push(`<p class="vide">${T`Aucun arrivage : rien dans les dossiers d\'arrivée, aucun nom à convertir.`}</p>`);
    else {
      html.push(`<table><thead><tr><th class="case"><input type="checkbox" id="arrTout" aria-label="${T`Cocher ou décocher toutes les lignes`}" title="${T`Tout cocher, tout décocher`}"${d.lignes.every((r) => A.coches.has(r.cle)) ? ' checked' : ''}></th><th class="ou">${T`Dossier`}</th><th>${T`Nom actuel`}</th><th class="et">${T`État`}</th><th>${T`Nom voulu`}</th><th class="actions"></th></tr></thead><tbody>`);
      for (const [pile, lignesPile] of parPile(d.lignes)) {
       html.push(bandePile('arr', pile, lignesPile.length));

        const [mot, ton] = STATUT[r.statut] || [r.statut, ''];

        const cands = r.statut === 'doute' && (r.candidats || []).length
          ? `<select data-cand="${h(r.cle)}" aria-label="${T`Fichiers Nexus possibles`}"><option value="">${T`Fichiers Nexus de cette minute…`}</option>`
            + r.candidats.map((c) => `<option value="${h(c.propose)}">${h(c.nexus)}${c.version ? ' · ' + h(c.version) : ''}</option>`).join('') + '</select>' : '';
        // arrivage d'un mod déjà en place, plus récent que lui : sa mise à jour, à ranger à sa place (aucune clé d'API)

        const court = (c) => h(c.nom.replace(/\.zip$/i, '')) + (c.lieu ? ' (' + h(c.lieu) + ')' : '');

  function ouvreConflits(cle) {

  }
  // dans la page, « Conflits » ouvre l'analyse dans un onglet à elle, à côté : la liste des mods reste sous les yeux
  $('conf').addEventListener('click', () => vscode.postMessage({ t: 'conflitsFenetre' }));
  $('scripts').addEventListener('click', () => vscode.postMessage({ t: 'codeFenetre' }));
  $('histo').addEventListener('click', () => vscode.postMessage({ t: 'journal' }));
  $('aide').addEventListener('click', () => vscode.postMessage({ t: 'aide', section: E.regle ? 'reglages' : E.arr ? 'arrivages' : E.maj ? 'maj' : '' }));
  $('magasin').addEventListener('click', () => { E.volet = { t: 'magasin' }; ouvre(T('Magasin'), `<p class="vide">${T`Lecture du magasin et du jeu…`}</p>`); vscode.postMessage({ t: 'magasin' }); });
  $('conflits').addEventListener('toggle', (e) => {
    const id = e.target.dataset && e.target.dataset.groupe;
    if (id === undefined || !E.conf) return;
    const avant = E.conf.deplies.has(id);
    if (e.target.open) E.conf.deplies.add(id); else E.conf.deplies.delete(id);
    if (avant !== e.target.open) dessineConflits();
  }, true);
  $('conflits').addEventListener('click', (e) => {
    const d = e.target.dataset, C = E.conf;
    if (d.tout) {
      C.ouverts.add(d.tout);
      if (!C.details[d.archive]) vscode.postMessage({ t: 'conflitsDetail', nom: d.archive });
    } else if (d.passe) return vscode.postMessage({ t: 'ordrePasse', nom: d.passe, cible: d.cible, sens: d.sens });
    else if (d.renomme) return vscode.postMessage({ t: 'ordreRenomme', nom: d.renomme });
    else if (d.rendnom) return vscode.postMessage({ t: 'ordreAnnule', nom: d.rendnom });
    else if (d.mlstop) return vscode.postMessage({ t: 'ordreModlistStop' });
    else if (d.codefen) return vscode.postMessage({ t: 'codeFenetre' });
    else if (d.archfen) return vscode.postMessage({ t: 'conflitsFenetre' });
    else if (d.grille) { C.grille = d.grille; C.deplies.clear(); }
    else if (d.ouvre) return vscode.postMessage({ t: 'ouvreFichier', chemin: d.ouvre, ligne: +d.ligne || 1 });
    else if (d.crelit) C.codeEchec = false;
    else if (e.target.closest('[data-cniv]')) {       // une puce de niveau ne montre que lui ; un second clic revient à la vue de départ
      const k = e.target.closest('[data-cniv]').dataset.cniv;
      C.cNiv = C.cNiv === k ? 'agir' : k; C.cSorte = ''; C.deplies.clear();
    }
    else if (e.target.closest('[data-csorte]')) {
      const k = e.target.closest('[data-csorte]').dataset.csorte;
      C.cSorte = C.cSorte === k ? '' : k; C.deplies.clear();
    }
    else if (d.resmode) C.resMode = d.resmode;
    else if (e.target.closest('[data-puce]')) {       // une puce de chiffres montre ce qu'elle compte
      const p = e.target.closest('[data-puce]').dataset.puce;
      C.deplies.clear();
      if (p === 'archives') { C.grille = 'archive'; C.montre = 'tous'; }
      else if (p === 'paires') C.grille = 'archives';
      else { C.grille = 'ressource'; C.resMode = p === 'identiques' ? 'identiques' : 'conflit'; C.baseSeul = p === 'base'; }
    }
    else if (d.montre) C.montre = d.montre;
    else if (d.ordre) C.tri = d.ordre;
    else if (d.va && SEULE) return vscode.postMessage({ t: 'montreMod', cle: d.va });
    else if (d.va) { fermeConflits(); $('cherche').value = ''; E.choisi = d.va; vscode.postMessage({ t: 'detail', cle: d.va }); return dessine(); }
    else return;

  });
  $('conflits').addEventListener('change', (e) => {
    if (e.target.id === 'egaux') E.conf.egaux = e.target.checked;

  function dessineReglages(m) {

      const etat = k === 'reference' ? (d.existe.reference ? T('Référence présente.') : T('Aucune référence à cet endroit.'))

      return `<div class="champ"><label for="c_${k}">${mot}</label><input type="text" id="c_${k}" value="${h(d[k])}" spellcheck="false"${manque ? ' class="manque"' : ''}`

        + `<small>${h(aide)}${k in d.effectif && !d[k] ? ' ' + h(defaut) + '.' : ''}${etat ? ' ' + etat : ''}</small></div>`;

    const html = [`<form id="formReglages" autocomplete="off"><h2>${T`Réglages`}</h2>`
      + (m.premier ? `<div class="avis">${T`Pour commencer, indiquez le dépôt de zips et le dossier du jeu, puis « Enregistrer ». Rien n\'est écrit dans le jeu ici.`}</div>` : ''), '',
      `<fieldset><legend>${T`Dossiers`}</legend>` + CHEMINS.map(chemin).join('')
      + `<div class="champ"><label for="c_journal">${T`Journal`}</label><input type="text" id="c_journal" value="${h(d.journal)}" placeholder="${h(d.effectif.journal)}" spellcheck="false"><span></span>`

      + `<div class="rang"><button type="button" id="conventionDefaut">${T`Remettre la convention par défaut`}</button></div>`
      + (ecartsHtml(d.ecarts) ? `<div class="aide">${ecartsHtml(d.ecarts)}</div>` : '')

      + `<div class="champ haut"><label for="l_reglages">${T`Vos motifs`}</label>${zone('l_reglages', d.reglages, 3)}<span></span>`
      + `<small>${T`La première lecture du jeu y ajoute ce qu\'elle trouve modifié.`}</small></div>`
      + `<details><summary>${N(d.reglages_defaut.length, '{n} motif par défaut, toujours appliqués', '{n} motifs par défaut, toujours appliqués')}</summary><pre>${h(d.reglages_defaut.join('\n'))}</pre></details></fieldset>`);
    html.push(`<fieldset><legend>${T`Sauvegardes des réglages`}</legend><p class="aide">${T`Copie datée des réglages des mods présents dans le jeu, qu\'un zip les ait livrés ou que le jeu les ait écrits (motifs ci-dessus ; ni caches, ni journaux, ni fichiers vides). Elle va dans le dossier des sauvegardes. Restaurer remet les fichiers différents ou absents, jeu fermé ; ceux d\'aujourd\'hui sont copiés avant.`}</p>`

    html.push(`<fieldset><legend>${T`Hors Red Stack`}</legend><p class="aide">${T`Territoire d\'un installateur tiers (ReShade pose lui-même ses shaders). Sous ces motifs, un fichier déjà présent que Red Stack n\'a pas posé`} `

      + `<div class="champ haut"><label for="l_exclus">${T`Dossiers exclus`}</label>${zone('l_exclus', d.reference_exclus)}<span></span><small>${T`Dossiers de la racine du jeu laissés hors de la copie.`}</small></div>`

      + `${T`Changer de dossier ne déplace rien : les réglages de cette page sont lus dans le nouveau.`}</small></div>`
      + `<p class="aide">${T`Moteur : <code>${h(p.moteur)}</code>`}<br>${T`Réglages écrits dans : <code>${h(d.fichier)}</code>`}</p>`
      + `<p class="aide">${T`Liens <code>nxm://</code> : le bouton « Mod manager download » de Nexus peut envoyer le fichier droit dans Red Stack, qui met à jour le zip du même mod ou range un mod nouveau dans les arrivages de la pile choisie (votre clé d\'API Nexus est demandée).`} `

      + `<pre id="mcp">${h(p.mcp)}</pre><div class="rang"><button type="button" id="copieMcp">${T`Copier la commande`}</button></div></fieldset>`);

  /** Section « Thème » : le thème en cours, un bouton par thème Red Stack, la case des icônes de la barre d'activité. */
  function etatTheme(t) {
    const z = $('etatTheme');
    if (!z || !t) return;

      return vscode.postMessage({ t: 'fomodFixe', cle: K.cle, neuf });
    }
    if (e.target.dataset.option !== undefined && e.target.type === 'checkbox') {
      // option prise en partie : un clic la prend en entier, le suivant la laisse
      vscode.postMessage({ t: 'option', cle: $('volet').dataset.cle, nom: e.target.dataset.option, valeur: e.target.dataset.partiel ? true : e.target.checked });
    } else if (e.target.dataset.entree !== undefined && e.target.type === 'checkbox') {
      vscode.postMessage({ t: 'option', cle: $('volet').dataset.cle, entree: e.target.dataset.entree, valeur: e.target.checked, mien: !!e.target.dataset.mien });
    }
  });
  $('profil').addEventListener('change', (e) => { ferme(); vscode.postMessage({ t: 'profil', nom: e.target.value }); });
  $('nouveau').addEventListener('click', () => vscode.postMessage({ t: 'profilNouveau' }));
  $('supprime').addEventListener('click', () => vscode.postMessage({ t: 'profilSupprime' }));
  $('actualise').addEventListener('click', () => vscode.postMessage({ t: 'actualise' }));
  $('plan').addEventListener('click', () => {
    // le plan s'ouvre dans le volet de la liste : une vue pleine page (mises à jour, arrivages, réglages) lui cède la place
    if (E.maj) fermeMaj();
    if (E.arr) fermeArrivages();
    if (E.regle) fermeReglages();
    vscode.postMessage({ t: 'plan' });
  });
  $('cherche').addEventListener('input', () => { dessine(); dessineConflits(); });
  $('complets').checked = E.complets;
  $('complets').addEventListener('change', (e) => { E.complets = e.target.checked; memorise(); dessine(); });
  $('dossiers').checked = E.dossiers;
  $('dossiers').addEventListener('change', (e) => { E.dossiers = e.target.checked; memorise(); dessine(); });
  $('natures').checked = E.natures;
  $('natures').addEventListener('change', (e) => { E.natures = e.target.checked; document.body.classList.toggle('sansnature', !E.natures); memorise(); });
  $('puces').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-filtre]'), l = e.target.closest('button[data-lotvers]');
    if (b) { E.filtre = b.dataset.filtre; E.lot.clear(); dessine(); }
    else if (l) {                                   // le lot coché : une seule confirmation dans VS Code, le moteur refuse ce qui ne se déplace pas
      const genre = { parques: 'parqué', retires: 'retiré' }[l.dataset.lotvers];
      const cles = [...E.lot].filter((k) => { const r = E.data.mods.find((x) => x.cle === k); return r && r.genre !== genre; });
      vscode.postMessage({ t: 'deplaceLot', vers: l.dataset.lotvers, cles, retour: 'liste' });   // les cases restent : la page se verrouille, puis l'état relu les retire
    } else if (e.target.closest('button[data-lotsuppr]')) {
      vscode.postMessage({ t: 'supprime', cles: [...E.lot].filter((k) => { const r = E.data.mods.find((x) => x.cle === k); return r && r.genre === 'retiré'; }) });
    } else if (e.target.closest('button[data-lotvide]')) { E.lot.clear(); dessine(); }
  });
  $('fichier').addEventListener('keydown', (e) => {
    const v = e.target.value.trim();
    if (e.key === 'Enter' && v.length >= 3) vscode.postMessage({ t: 'fichier', nom: v });
  });
  $('fermeAlerte').addEventListener('click', () => { $('alerte').className = ''; });

  window.addEventListener('message', (e) => {
    const m = e.data;
    // fenêtre d'analyse : elle ne garde que l'état, les conflits et les signaux du moteur
    if (SEULE && !['etat', 'conflits', 'conflitsDetail', 'conflitsRessources', 'conflitsCode', 'conflitsCible', 'occupe', 'verrou', 'erreur'].includes(m.t)) return;
    if (m.t === 'conflitsCible') { if (SEULE && E.data) ouvreConflits(m.cle || ''); return; }
    if (m.t === 'reglages') {
      if (m.premier) $('chiffres').textContent = T('À régler : le dépôt de zips et le dossier du jeu.');
      dessineReglages(m);
    } else if (m.t === 'chemin') {
      if ($(m.champ)) { $(m.champ).value = m.chemin; $(m.champ).classList.remove('manque'); }
    } else if (m.t === 'reference') {
      etatReference(m.data);
    } else if (m.t === 'etat') {
      if (E.regle && E.regle.premier) fermeReglages();
      E.data = m.data; E.profil = m.data.profil; E.profils = m.profils; E.ecarts = m.ecarts;
      for (const P of [E.vol, E.attente]) for (const [k, v] of P) { const r = E.data.mods.find((x) => x.cle === k); if (r && !r.lieu) r.actif = v; }   // coches pas encore jouées : gardées à l'écran
      $('actualise').title = (m.veille === false ? `${T('Actualisation automatique coupée (réglage redStack.actualisationAuto).')} `
        : `${T('Red Stack relit seul quand le dépôt, les archives du jeu ou un profil changent.')} `)
        + T`Dernière lecture à ${new Date().toLocaleTimeString()}${m.auto ? ` ${T('(automatique)')}` : ''}. Clic : relire maintenant.`;
      if (m.auto && E.arr) vscode.postMessage({ t: 'convention' });   // le dépôt a bougé : les arrivages suivent, les noms retouchés sont gardés
      if (m.auto && E.volet && E.volet.t === 'journal') vscode.postMessage({ t: 'journal' });
      dessine();
      if (SEULE && !E.conf) ouvreConflits(document.body.dataset.cle || '');
      // le plan ouvert suit le profil : une case cochée ou « Actualiser » le refait (sauf s'il vient d'arriver)
      if (E.volet && E.volet.t === 'plan' && Date.now() - (E.planRecu || 0) > 1500) vscode.postMessage({ t: 'plan' });
    } else if (m.t === 'python') {                  // aucun Python pour lancer le moteur : dire quoi faire, sans bandeau d'erreur
      $('chiffres').textContent = T('Python introuvable.');
      $('liste').innerHTML = `<div class="vide"><p>${T`Red Stack lance son moteur avec Python ${h(m.min)} ou plus récent, et n'en trouve pas sur ce poste.`} `
        + `${T`Commandes essayées :`} ${m.essais.map((x) => `<code>${h(x)}</code>`).join(', ')}.</p>`
        + (m.vieux ? `<p>${T`Trouvé : Python ${h(m.vieux.version)} (<code>${h(m.vieux.nom)}</code>), trop ancien.`}</p>` : '')
        + `<p>${T`Installez Python depuis python.org en cochant « Add python.exe to PATH », puis « Réessayer ». Rien d'autre n'est à installer : le moteur est dans l'extension.`}</p>`
        + `<p><button class="plein" id="pythonSite">${T`Télécharger Python`}</button> <button id="pythonEncore">${T`Réessayer`}</button> `
        + `<button id="pythonCommande">${T`Indiquer la commande Python…`}</button></p></div>`;
      for (const k of ['pythonSite', 'pythonEncore', 'pythonCommande']) $(k).addEventListener('click', () => vscode.postMessage({ t: k }));
    } else if (m.t === 'aucunProfil') {
      if (E.regle && E.regle.premier) fermeReglages();
      $('chiffres').textContent = T("Aucun profil pour l'instant.");
      $('liste').innerHTML = `<div class="vide"><p>${T`Red Stack ne connaît pas encore ce jeu. La première lecture compare le jeu aux zips du dépôt et crée le profil « actuel » : elle n'écrit rien dans le jeu, et peut prendre une à deux minutes.`}</p>`
        + `<p><button class="plein" id="adopte">${T`Lire le jeu et créer le profil`}</button></p>`
        + (m.ecarts && !m.ecarts.piles ? `<p>${T`Aucun zip trouvé dans le dépôt.`} ${T`Red Stack lit les zips posés à la racine du dépôt, dans ses piles et dans leurs dossiers de convention.`}</p>` : '')
        + `${ecartsHtml(m.ecarts)}</div>`;
      $('adopte').addEventListener('click', (ev) => { ev.target.disabled = true; vscode.postMessage({ t: 'adopte' }); });
    } else if (m.t === 'detail') {
      E.choisi = m.data.cle; voletDetail(m.data); dessine();
    } else if (m.t === 'plan') {
      E.planRecu = Date.now();
      voletPlan(m.data);
    } else if (m.t === 'fichier') {
      voletFichier(m.nom, m.data);
    } else if (m.t === 'journal') {
      voletJournal(m.data);
    } else if (m.t === 'magasin') {
      if (E.volet && E.volet.t === 'magasin') voletMagasin(m.data);
    } else if (m.t === 'sauvegarde') {
      etatSauve(m);
    } else if (m.t === 'conflits') {
      E.cf = m.data; E.cfMods = conflitsParMod();
      if (E.conf) { E.conf.details = {}; E.conf.ouverts = new Set(); E.conf.res = null; E.conf.resDemande = false; E.conf.code = null; E.conf.codeDemande = false; }
      dessine(); dessineConflits();
    } else if (m.t === 'conflitsCode') {
      if (E.conf) { E.conf.code = m.data; E.conf.codeDemande = false; E.conf.codeEchec = false; if (E.conf.grille === 'code') dessineConflits(); }
    } else if (m.t === 'conflitsRessources') {
      if (E.conf) { E.conf.res = m.data; dessineConflits(); }
    } else if (m.t === 'convention') {
      recoitArrivages(m);
    } else if (m.t === 'fomod') {
      if (E.volet && E.volet.t === 'fomod' && E.volet.K.cle === m.cle) voletFomod({ cle: m.cle, data: m.data, dit: m.dit || '', images: E.volet.K.images });
    } else if (m.t === 'fomodImage') {
      if (E.volet && E.volet.t === 'fomod' && E.volet.K.cle === m.cle) { E.volet.K.images[m.entree] = m.image || ''; voletFomod(E.volet.K); }
    } else if (m.t === 'theme') {
      etatTheme(m.data);
    } else if (m.t === 'nxm') {
      etatNxm(m.data);
    } else if (m.t === 'majOccupe') {
      if (E.maj) { E.maj.occupe = m.enCours || null; dessineMaj(); }
    } else if (m.t === 'majAvance') {             // deux fois par seconde : la barre et sa ligne seules, la vue n'est pas redessinée
      if (E.maj && E.maj.occupe && m.avance) {
        E.maj.occupe.avance = m.avance;
        const barre = $('majBarre'), ligne = $('majDebit');
        if (barre && m.avance.lotTotal) { barre.max = m.avance.lotTotal; barre.value = m.avance.lotRecu; }
        if (ligne) ligne.textContent = ditAvance(m.avance);
      }
    } else if (m.t === 'maj') {
      recoitMaj(m);
    } else if (m.t === 'contenu') {
      if (E.arr && E.arr.contenu && E.arr.contenu.cle === m.cle) {
        E.arr.contenu = { cle: m.cle, data: m.data, vers: {}, dit: m.dit || '', nom: E.arr.contenu.nom };
        dessineArrivages();
      } else if (E.volet && E.volet.t === 'contenu' && E.volet.K.cle === m.cle) {
        voletContenu({ cle: m.cle, data: m.data, vers: {}, dit: m.dit || '', nom: E.volet.K.nom });
      }
    } else if (m.t === 'noms') {
      if (E.volet && E.volet.t === 'noms' && E.volet.K.cle === m.cle) voletNoms({ cle: m.cle, data: m.data, vers: {}, dit: m.dit || '' });
    } else if (m.t === 'vue') {                      // raccourci de la barre latérale
      if (m.v === 'plan') $('plan').click();
      else if (m.v === 'arrivages' && !E.arr) $('arriv').click();
      else if (m.v === 'maj' && !E.maj) $('maj').click();
      else if (m.v === 'reglages' && !E.regle) $('regle').click();
      else if (m.v === 'historique') $('histo').click();
      else if (m.v === 'magasin') $('magasin').click();
    } else if (m.t === 'conflitsDetail') {
      if (E.conf) { E.conf.details[m.nom] = m.data; dessineConflits(); }
    } else if (m.t === 'applique') {
      $('alerte').className = ''; ferme();
      if (E.volet && E.volet.t === 'journal') vscode.postMessage({ t: 'journal' });
    } else if (m.t === 'basculeFait') {
      E.vol = new Map();
    } else if (m.t === 'verrou') {                  // un geste écrit le dépôt, le magasin ou le jeu : rien ne se coche ni ne se clique d'ici sa fin
      document.body.classList.toggle('verrou', !!m.on);
      for (const x of document.querySelectorAll('body > header, #resume, #puces, body > main, body > section.vue')) x.inert = !!m.on;
    } else if (m.t === 'occupe') {
      $('occupe').className = m.n ? 'on' : '';
    } else if (m.t === 'erreur') {
      if (E.conf && E.conf.codeDemande && !E.conf.code) { E.conf.codeDemande = false; E.conf.codeEchec = true; if (E.conf.grille === 'code') dessineConflits(); }
      $('alerte').querySelector('span').textContent = m.message;
      $('alerte').className = 'on';
    }
  });
  vscode.postMessage({ t: 'pret' });
})();
</script>
</body>
</html>
